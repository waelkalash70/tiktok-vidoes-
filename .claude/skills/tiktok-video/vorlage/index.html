<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root { --ground: #05060a; --ink: #ffffff; --gold: #ffd23f; --red: #ff3b3b; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; position: relative; font-family: "Montserrat"; }
      #bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 60%, #1a1a2e 0%, #05060a 70%); }
      #bar { position: absolute; left: 0; right: 0; top: 300px; text-align: center; }
      #bar-label { color: #fff; font-weight: 700; font-size: 30px; letter-spacing: 0.35em; }
      #bar-num { color: var(--gold); font-weight: 900; font-size: 96px; text-shadow: 0 0 24px rgba(255,210,63,.8), 0 0 60px rgba(255,170,0,.5); }
      .word { position: absolute; left: 120px; right: 192px; top: 1040px; text-align: center;
              font-weight: 900; font-size: 110px; color: var(--ink);
              -webkit-text-stroke: 6px #000; paint-order: stroke fill; text-shadow: 0 6px 18px rgba(0,0,0,.7); }
      .word span { display: inline-block; }
      .gold span { color: var(--gold); text-shadow: 0 0 30px rgba(255,200,0,.9); }
      .red span { color: var(--red); text-shadow: 0 0 30px rgba(255,40,40,.9); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-start="0" data-duration="3" data-track-index="0"></div>
      <div id="bar" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <div id="bar-label">NETTOVERMÖGEN</div>
        <div id="bar-num">1.000.000 €</div>
      </div>
      <div id="w1" class="word clip" data-start="0" data-duration="0.7" data-track-index="2"><span>Reiche</span></div>
      <div id="w2" class="word gold clip" data-start="0.7" data-duration="0.8" data-track-index="2"><span>Firmen</span></div>
      <div id="w3" class="word red clip" data-start="1.5" data-duration="1.5" data-track-index="2"><span>Finanzamt</span></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const n = { v: 1000000 };
      const el = document.getElementById("bar-num");
      tl.to(n, { v: 4795721, duration: 3, ease: "power1.inOut",
        onUpdate: () => { el.textContent = Math.round(n.v).toLocaleString("de-DE") + " €"; } }, 0);
      [["#w1 span",0],["#w2 span",0.7],["#w3 span",1.5]].forEach(([s,t]) =>
        tl.fromTo(s, { scale: 0.8 }, { scale: 1, duration: 0.1, ease: "back.out(3)" }, t));
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
