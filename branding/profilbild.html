<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<script type="importmap">{ "imports": { "three": "./lib/three/three.module.js", "three/addons/": "./lib/three/addons/" } }</script>
<style>html,body{margin:0;background:#030409;width:1080px;height:1080px;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1080" height="1080"></canvas>
<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { LineSegments2 } from "three/addons/lines/LineSegments2.js";
import { LineSegmentsGeometry } from "three/addons/lines/LineSegmentsGeometry.js";
import { LineMaterial } from "three/addons/lines/LineMaterial.js";

const V = new URLSearchParams(location.search).get("v") || "A";
const S = 1080;
await document.fonts.load("900 200px Montserrat").catch(() => {});
function mulberry32(a){return function(){a|=0;a=(a+0x6d2b79f5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
const rnd = mulberry32(7);

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(S, S, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.95; renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x030409); scene.fog = new THREE.FogExp2(0x030409, 0.03);
const pmrem = new THREE.PMREMGenerator(renderer); scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.45;
const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 200);
scene.add(new THREE.HemisphereLight(0x22335a, 0x000000, 0.6));
const key = new THREE.DirectionalLight(0xffdcaa, 2.4); key.position.set(4, 7, 8); scene.add(key);
const rim = new THREE.DirectionalLight(0x5f7dff, 1.8); rim.position.set(-6, 4, -5); scene.add(rim);
const warm = new THREE.PointLight(0xffaa33, 10, 10, 2); warm.position.set(1.5, 3, 3); scene.add(warm);

const lineMat = (c, w, o) => { const m = new LineMaterial({ color: c, linewidth: w, transparent: true, opacity: o }); m.resolution.set(S, S); return m; };
function cage(w, h, d, color, width, op, step = 0.5, div = 3) {
  const p = [], x0 = -w/2, x1 = w/2, z0 = -d/2, z1 = d/2, L = (a, b) => p.push(...a, ...b);
  const rings = Math.max(1, Math.round(h / step));
  for (let i = 0; i <= rings; i++) { const y = h * i / rings; L([x0,y,z0],[x1,y,z0]); L([x1,y,z0],[x1,y,z1]); L([x1,y,z1],[x0,y,z1]); L([x0,y,z1],[x0,y,z0]); }
  for (let i = 0; i <= div; i++) { const fx = x0 + (x1-x0)*i/div, fz = z0 + (z1-z0)*i/div; L([fx,0,z0],[fx,h,z0]); L([fx,0,z1],[fx,h,z1]); L([x0,0,fz],[x0,h,fz]); L([x1,0,fz],[x1,h,fz]); }
  const g = new LineSegmentsGeometry(); g.setPositions(p); return new LineSegments2(g, lineMat(color, width, op));
}
const gold = () => new THREE.MeshStandardMaterial({ color: 0xffc23a, emissive: 0xff8a10, emissiveIntensity: 0.18, metalness: 0.8, roughness: 0.3 });

// Boden + Raster
const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshBasicMaterial({ color: 0x030409 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const grid = new THREE.GridHelper(60, 60, 0x5a4214, 0x2a1f0a); grid.position.y = 0.005; grid.material.transparent = true; grid.material.opacity = 0.35; scene.add(grid);
// Skyline
const bMat = new THREE.MeshStandardMaterial({ color: 0x07080d, roughness: 0.8 });
const winMat = new THREE.MeshBasicMaterial({ color: 0xa8742a, fog: false }); const wins = [];
for (let i = 0; i < 26; i++) {
  const w = 1 + rnd() * 1.6, h = 3 + rnd() * 9, x = -18 + i * 1.45, z = -22 - rnd() * 6;
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 1.2), bMat); m.position.set(x, h / 2, z); scene.add(m);
  const e = cage(w, h, 1.2, 0x9a7426, 1.2, 0.4, 100, 1); e.position.set(x, 0, z); scene.add(e);
  for (let y = 0.6; y < h - 0.4; y += 0.5) for (let fx = -w/2 + 0.3; fx < w/2 - 0.2; fx += 0.34) if (rnd() < 0.22) wins.push([x + fx, y, z + 0.61]);
}
const wi = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.13, 0.17), winMat, wins.length); const M4 = new THREE.Matrix4();
wins.forEach((p, i) => { M4.makeTranslation(...p); wi.setMatrixAt(i, M4); }); scene.add(wi);
// Goldstaub
const dp = []; for (let i = 0; i < 260; i++) dp.push((rnd() - 0.5) * 14, rnd() * 7, -6 + rnd() * 9);
const dg = new THREE.BufferGeometry(); dg.setAttribute("position", new THREE.Float32BufferAttribute(dp, 3));
scene.add(new THREE.Points(dg, new THREE.PointsMaterial({ color: 0xffcf66, size: 0.045, transparent: true, opacity: 0.8 })));

// Figur (Maskottchen aus den Videos)
function figure() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.42, 0.75, 8, 32), new THREE.MeshPhysicalMaterial({ color: 0x1b2a6b, metalness: 0.2, roughness: 0.25, clearcoat: 1, clearcoatRoughness: 0.12 }));
  body.position.y = 0.82; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.36, 48, 32), new THREE.MeshPhysicalMaterial({ color: 0xc9cbd2, roughness: 0.32, clearcoat: 1, clearcoatRoughness: 0.2 }));
  head.position.y = 1.72; g.add(head);
  const euro = coinFace("€", 0.34); euro.position.set(0, 1.08, 0.43); g.add(euro);
  return g;
}
function coinFace(txt, size) {
  const c = document.createElement("canvas"); c.width = c.height = 256; const x = c.getContext("2d");
  x.font = "900 190px Montserrat"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillStyle = "#ffd23f"; x.shadowColor = "#ffb000"; x.shadowBlur = 20; x.fillText(txt, 128, 140);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return new THREE.Mesh(new THREE.PlaneGeometry(size, size), new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false }));
}
// Große Münze mit geprägtem €
function bigCoin(r) {
  const g = new THREE.Group();
  const rimM = gold(); rimM.emissiveIntensity = 0.25;
  const body = new THREE.Mesh(new THREE.CylinderGeometry(r, r, r * 0.16, 96), rimM); body.rotation.x = Math.PI / 2; g.add(body);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(r * 0.86, r * 0.035, 16, 96), gold()); ring.position.z = r * 0.085; g.add(ring);
  const c = document.createElement("canvas"); c.width = c.height = 512; const x = c.getContext("2d");
  const gr = x.createRadialGradient(256, 220, 40, 256, 256, 256); gr.addColorStop(0, "#ffe27a"); gr.addColorStop(1, "#c98a12");
  x.fillStyle = gr; x.beginPath(); x.arc(256, 256, 256, 0, 7); x.fill();
  x.font = "900 330px Montserrat"; x.textAlign = "center"; x.textBaseline = "middle";
  x.fillStyle = "rgba(90,45,0,.55)"; x.fillText("€", 262, 288); x.fillStyle = "#fff1b8"; x.fillText("€", 252, 276);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const face = new THREE.Mesh(new THREE.CircleGeometry(r * 0.82, 96), new THREE.MeshStandardMaterial({ map: t, metalness: 0.6, roughness: 0.35, emissive: 0xffa020, emissiveMap: t, emissiveIntensity: 0.28 }));
  face.position.z = r * 0.081; g.add(face);
  return g;
}
const coinGeo = new THREE.CylinderGeometry(0.16, 0.16, 0.035, 32); coinGeo.rotateX(Math.PI / 2);
function smallCoins(n, center, rad, spread) {
  const m = new THREE.InstancedMesh(coinGeo, gold(), n), q = new THREE.Quaternion(), e = new THREE.Euler(), s = new THREE.Vector3(1,1,1), p = new THREE.Vector3();
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2 + rnd() * 0.4; p.set(center.x + Math.cos(a) * rad, center.y + (rnd() - 0.5) * spread, center.z - 0.4 - Math.abs(Math.sin(a)) * rad * 0.6); e.set(rnd() * 3, rnd() * 3, rnd() * 3); q.setFromEuler(e); M4.compose(p, q, s); m.setMatrixAt(i, M4); }
  scene.add(m); return m;
}

if (V === "A") { // Maskottchen vor goldenem Geldturm
  const t = new THREE.Group(); t.position.set(0.55, 0, -0.9); scene.add(t);
  t.add(cage(1.25, 3.2, 1.25, 0xffc23a, 2.6, 0.95, 0.4, 3));
  const f = new THREE.Mesh(new THREE.BoxGeometry(1.15, 2.1, 1.15), gold()); f.position.y = 1.05; t.add(f);
  const fig = figure(); fig.position.set(-0.45, 0, 0.5); fig.rotation.y = 0.28; scene.add(fig);
  smallCoins(7, new THREE.Vector3(0.5, 3.4, -0.9), 1.0, 0.5);
  camera.position.set(-0.1, 1.7, 7.4); camera.lookAt(0.05, 1.5, 0);
} else if (V === "B") { // Große €-Münze
  const coin = bigCoin(1.25); coin.position.set(0, 1.75, 0); coin.rotation.set(-0.08, -0.38, 0.04); scene.add(coin);
  const t1 = cage(1.0, 4.2, 1.0, 0xffc23a, 2.0, 0.55, 0.4, 2); t1.position.set(-2.0, 0, -2.2); scene.add(t1);
  const t2 = cage(1.0, 3.0, 1.0, 0xffc23a, 2.0, 0.55, 0.4, 2); t2.position.set(2.0, 0, -2.4); scene.add(t2);
  smallCoins(10, new THREE.Vector3(0, 1.75, 0), 1.7, 1.6);
  camera.position.set(0, 1.85, 7.2); camera.lookAt(0, 1.75, 0);
} else { // C: Maskottchen hält Riesenmünze
  const coin = bigCoin(0.95); coin.position.set(0.72, 1.35, 0.35); coin.rotation.set(-0.05, -0.55, 0.12); scene.add(coin);
  const fig = figure(); fig.position.set(-0.45, 0, 0); fig.rotation.y = 0.35; scene.add(fig);
  const t = cage(1.1, 3.6, 1.1, 0xffc23a, 2.2, 0.75, 0.4, 3); t.position.set(0.2, 0, -2.0); scene.add(t);
  smallCoins(6, new THREE.Vector3(0.2, 3.1, -1.2), 1.1, 0.5);
  camera.position.set(0.05, 1.5, 6.4); camera.lookAt(0.15, 1.3, 0);
}

const composer = new EffectComposer(renderer); composer.setPixelRatio(1); composer.setSize(S, S);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(S / 2, S / 2), 0.6, 0.5, 0.75));
composer.addPass(new OutputPass());
composer.render(); composer.render();
window.__done = true;
</script>
</body>
</html>
