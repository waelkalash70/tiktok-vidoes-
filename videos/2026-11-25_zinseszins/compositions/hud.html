<template>
  <style>

  <div id="root" data-composition-id="hud" data-width="1080" data-height="1920">
    <div id="hud-bar" class="clip" data-start="0" data-duration="42.02" data-track-index="0">
      <div id="hud-label">WER HAT MIT 65 MEHR?</div>
      <span id="hud-num">ANNA vs. BEN</span>
      <span id="hud-delta">&nbsp;</span>
    </div>
    <div id="hud-src" class="hud-src clip" data-start="0.2" data-duration="7.34" data-track-index="1">7 % p. a. · ohne Steuern · keine Garantie</div>
    <div id="hud-src2" class="hud-src clip" data-start="21.77" data-duration="11.55" data-track-index="1">7 % p. a. · ohne Steuern · keine Garantie</div>
  </div>
  <script>
    (function () {
      const B = {"hook": {"start": 0.22, "end": 3.2, "key": 0.93}, "reicher": {"start": 3.2, "end": 5.5, "key": 3.83}, "frage": {"start": 5.5, "end": 6.74, "key": 5.94}, "anna": {"start": 6.74, "end": 10.42, "key": 8.67}, "annastop": {"start": 10.42, "end": 14.7, "key": 13.23}, "ben": {"start": 14.7, "end": 19.18, "key": 18.03}, "benpaid": {"start": 19.18, "end": 21.77, "key": 19.76}, "rendite": {"start": 21.77, "end": 24.38, "key": 22.567}, "twist": {"start": 24.38, "end": 26.3, "key": 24.38}, "benend": {"start": 26.3, "end": 30.42, "key": 27.48}, "annaend": {"start": 30.42, "end": 33.32, "key": 30.59}, "punch": {"start": 33.32, "end": 35.58, "key": 33.91}, "lehre": {"start": 35.58, "end": 38.3, "key": 37.47}, "cta": {"start": 38.3, "end": 41.12, "key": 38.3}, "T": 42.02};

      const clamp = (x) => Math.min(1, Math.max(0, x)), seg = (t, a, b) => clamp((t - a) / (b - a));
      const eout = (x) => 1 - Math.pow(1 - x, 3), eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const eur = (v) => Math.round(v).toLocaleString("de-DE") + " €";
      const GOLD = "rgb(255,210,63)", RED = "rgb(255,72,72)", ORANGE = "rgb(255,166,64)";
      // Zinseszins-Tabellen (monatlich, 7 % p. a., 300 €/Monat) – identisch zur 3D-Szene
      const r = 0.07 / 12, M = 480;
      function table(m0, m1) { const v = [0], p = [0]; let x = 0, q = 0; for (let m = 0; m < M; m++) { x *= 1 + r; if (m >= m0 && m < m1) { x += 300; q += 300; } v.push(x); p.push(q); } return { v, p }; }
      const A = table(0, 120), Bn = table(120, 480);

      function ageAt(t) {

        if (t < B.annastop.key) return 25 + 10 * eio(seg(t, B.anna.key, B.annastop.key));

        return 35 + 30 * eio(seg(t, B.twist.start, B.benend.key - 0.2));
      }
      function state(t) {

        const age = ageAt(t);
        pulse = Math.sin(seg(t, B.reicher.key, B.reicher.key + 0.4) * Math.PI) * 0.5;
        if (t >= B.anna.start) {
          label = "ANNA · ALTER " + Math.floor(age); text = eur(at(A.v, age)); pulse = 0;

        }
        if (t >= B.ben.start) {
          label = "BEN ZAHLT EIN (35–65)"; text = eur(108000 * eout(seg(t, B.ben.key, B.benpaid.key + 0.6)));
          delta = "300 € × 360 Monate"; dA = 1; pulse = Math.sin(seg(t, B.benpaid.key, B.benpaid.key + 0.4) * Math.PI);
        }
        if (t >= B.rendite.start) { label = "RENDITE FÜR BEIDE"; text = "7 % / Jahr"; delta = ""; pulse = Math.sin(seg(t, B.rendite.key, B.rendite.key + 0.4) * Math.PI); }
        if (t >= B.twist.start) { label = "ZEITRAFFER"; text = "ALTER " + Math.floor(age); pulse = 0; }
        if (t >= B.benend.start) {
          label = "BEN MIT " + Math.floor(age); text = eur(Math.round(at(Bn.v, age) / 1000) * 1000);
          pulse = Math.sin(seg(t, B.benend.key + 0.7, B.benend.key + 1.1) * Math.PI);
        }
        if (t >= B.annaend.start) {
          label = "ANNA MIT 65";
          text = eur(Math.round((366000 + 55000 * eout(seg(t, B.annaend.key, B.annaend.key + 0.7))) / 1000) * 1000);
          pulse = Math.sin(seg(t, B.annaend.key + 0.6, B.annaend.key + 1.0) * Math.PI) * 1.3;
          if (t > B.annaend.key + 0.6) { delta = "+55.000 € mehr als Ben"; dA = Math.min(1, (t - B.annaend.key - 0.6) / 0.15); }
        }
        if (t >= B.punch.start) {
          label = "ANNA HAT EINGEZAHLT"; text = "36.000 €"; delta = "Ben: 108.000 €"; dA = 1; dColor = RED;
          pulse = Math.sin(seg(t, B.punch.key, B.punch.key + 0.4) * Math.PI);
        }
        if (t >= B.lehre.start) {
          label = "ENTSCHEIDEND IST"; delta = "";
          text = t < B.lehre.key ? "NICHT DIE SUMME" : "DIE ZEIT"; color = t < B.lehre.key ? RED : GOLD;
          pulse = Math.sin(seg(t, B.lehre.key, B.lehre.key + 0.4) * Math.PI);
        }
        if (t >= B.cta.start) { label = "FOLGEN FÜR"; text = "TEIL 2"; color = GOLD; delta = ""; pulse = Math.sin(seg(t, B.cta.start, B.cta.start + 0.4) * Math.PI); }
        return { label, text, color, pulse, delta, dA, dColor };
      }
      const tl = gsap.timeline({ paused: true });
      tl.to({ x: 0 }, {
