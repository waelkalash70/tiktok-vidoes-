    <script>

    <script type="module">
      import * as THREE from "three";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
      import { Reflector } from "three/addons/objects/Reflector.js";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
      import { LineSegments2 } from "three/addons/lines/LineSegments2.js";
      import { LineSegmentsGeometry } from "three/addons/lines/LineSegmentsGeometry.js";
      import { LineMaterial } from "three/addons/lines/LineMaterial.js";

      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      let resolveReady; window.__hf.buildReady.world = new Promise((r) => (resolveReady = r));
      let ready = false, lastT = 0;
      window.addEventListener("hf-seek", (e) => { lastT = e.detail.time; if (ready) render(lastT); });
      await Promise.all([document.fonts.load("900 64px Montserrat"), document.fonts.load("900 220px Montserrat")]);

      const B = __BEATS__;
      const W = 1080, H = 1920;

      // ---------- Hilfsfunktionen ----------
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const seg = (t, a, b) => clamp((t - a) / (b - a));
      const sm = (x) => x * x * (3 - 2 * x);
      const smr = (x) => x * x * x * (x * (x * 6 - 15) + 10);
      const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const eout = (x) => 1 - Math.pow(1 - x, 3);
      const lerp = (a, b, x) => a + (b - a) * x;
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const rnd = mulberry32(20261124);

      // ---------- Renderer ----------
      const canvas = document.getElementById("world");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.92;
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x030409);
      scene.fog = new THREE.FogExp2(0x030409, 0.022);
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.35;

      const camera = new THREE.PerspectiveCamera(48, W / H, 0.1, 200);

      scene.add(new THREE.HemisphereLight(0x22335a, 0x000000, 0.5));
      const key = new THREE.DirectionalLight(0xffdcaa, 2.2); key.position.set(5, 9, 7); scene.add(key);
      const rim = new THREE.DirectionalLight(0x5f7dff, 1.4); rim.position.set(-6, 5, -7); scene.add(rim);
      const towerLight = new THREE.PointLight(0xffaa33, 7, 9, 2); towerLight.position.set(0, 6.0, 3.5); scene.add(towerLight);

      // ---------- Materialien ----------
      const GOLD = 0xffc23a;
      const goldMat = () => new THREE.MeshStandardMaterial({ color: GOLD, emissive: 0xff8a10, emissiveIntensity: 0.16, metalness: 0.75, roughness: 0.34 });
      const lineMat = (color, width, opacity) => {
        const m = new LineMaterial({ color, linewidth: width, transparent: true, opacity, worldUnits: false });
        m.resolution.set(W, H); return m;
      };

      // Gitter-Käfig (wie Referenz): Kanten, Ringe alle `step`, senkrechte Teilungen je Seite
      function cagePositions(w, h, d, step = 0.5, div = 3) {
        const p = [], x0 = -w / 2, x1 = w / 2, z0 = -d / 2, z1 = d / 2;
        const L = (a, b) => p.push(...a, ...b);
        const rings = Math.max(1, Math.round(h / step));
        for (let i = 0; i <= rings; i++) { const y = (h * i) / rings; L([x0, y, z0], [x1, y, z0]); L([x1, y, z0], [x1, y, z1]); L([x1, y, z1], [x0, y, z1]); L([x0, y, z1], [x0, y, z0]); }
        for (let i = 0; i <= div; i++) {
          const fx = lerp(x0, x1, i / div), fz = lerp(z0, z1, i / div);
          L([fx, 0, z0], [fx, h, z0]); L([fx, 0, z1], [fx, h, z1]); L([x0, 0, fz], [x0, h, fz]); L([x1, 0, fz], [x1, h, fz]);
        }
        return p;
      }
      function cage(w, h, d, color, width, opacity, step, div) {
        const g = new LineSegmentsGeometry(); g.setPositions(cagePositions(w, h, d, step, div));
        return new LineSegments2(g, lineMat(color, width, opacity));
      }

      // Text-Schild als Sprite (Badge wie „FIRMA 1“ in der Referenz)
      function label(text, { color = "#ffd23f", border = color, size = 64, worldH = 0.42, bg = "rgba(5,6,10,0.82)", weight = 900, pad = 0.42 } = {}) {
        const c = document.createElement("canvas"), x = c.getContext("2d");
        const font = `${weight} ${size}px Montserrat`;
        x.font = font; const tw = Math.ceil(x.measureText(text).width);
        const ph = Math.round(size * pad), cw = tw + ph * 2 + 8, ch = Math.round(size * 1.5);
        c.width = cw; c.height = ch;
        x.font = font; x.textBaseline = "middle"; x.textAlign = "center";
        const r = ch * 0.22;
        x.beginPath(); x.roundRect(4, 4, cw - 8, ch - 8, r); x.fillStyle = bg; x.fill();
        x.lineWidth = 6; x.strokeStyle = border; x.stroke();
        x.fillStyle = color; x.shadowColor = color; x.shadowBlur = 18; x.fillText(text, cw / 2, ch / 2 + size * 0.04);
        const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
        const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, fog: false }));
        s.scale.set((worldH * cw) / ch, worldH, 1); s.userData.base = s.scale.clone();
        return s;
      }
      function glyph(text, color, worldH) {
        const c = document.createElement("canvas"), x = c.getContext("2d"); c.width = 256; c.height = 256;
        x.font = "900 220px Montserrat"; x.textAlign = "center"; x.textBaseline = "middle";
        x.fillStyle = color; x.shadowColor = color; x.shadowBlur = 30; x.fillText(text, 128, 140);
        const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
        const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, fog: false }));
        s.scale.set(worldH, worldH, 1); s.userData.base = s.scale.clone(); return s;
      }

      // ---------- Boden: Spiegelung + Goldraster ----------
      const mirror = new Reflector(new THREE.PlaneGeometry(140, 140), { textureWidth: 540, textureHeight: 960, color: 0x8a8a8a, clipBias: 0.003 });
      mirror.rotation.x = -Math.PI / 2; scene.add(mirror);
      const dim = new THREE.Mesh(new THREE.PlaneGeometry(140, 140), new THREE.MeshBasicMaterial({ color: 0x030409, transparent: true, opacity: 0.74 }));
      dim.rotation.x = -Math.PI / 2; dim.position.y = 0.004; scene.add(dim);
      const grid = new THREE.GridHelper(80, 80, 0x5a4214, 0x2a1f0a); grid.position.y = 0.008;
      grid.material.transparent = true; grid.material.opacity = 0.32; scene.add(grid);

      // ---------- Skyline im Hintergrund ----------
      const sky = new THREE.Group(); scene.add(sky);
      const bMat = new THREE.MeshStandardMaterial({ color: 0x07080d, roughness: 0.8, metalness: 0.2 });
      const winGeo = new THREE.PlaneGeometry(0.13, 0.17);
      const winMat = new THREE.MeshBasicMaterial({ color: 0x9a6a22, fog: false });
      const winList = [];
      for (let i = 0; i < 34; i++) {
        const w = 1.0 + rnd() * 1.6, d = 1.0 + rnd() * 1.2;
        const cx = -24 + i * 1.45 + (rnd() - 0.5) * 0.6;
        const center = 1 - Math.min(1, Math.abs(cx) / 24);
        const h = 2.5 + rnd() * 6 + center * 6;
        const z = -44 - rnd() * 8;
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), bMat); m.position.set(cx, h / 2, z); sky.add(m);
        const e = cage(w, h, d, 0x9a7426, 1.4, 0.45, 100, 1); e.position.set(cx, 0, z); sky.add(e);
        for (let fy = 0.6; fy < h - 0.4; fy += 0.5) for (let fx = -w / 2 + 0.3; fx < w / 2 - 0.2; fx += 0.34)
          if (rnd() < 0.2) winList.push([cx + fx, fy, z + d / 2 + 0.01]);
      }
      // Wahrzeichen: generischer Fernsehturm
      const spire = new THREE.Group(); spire.position.set(6, 0, -52); sky.add(spire);
      const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.7, 18, 12), bMat); shaft.position.y = 9; spire.add(shaft);
      const pod = new THREE.Mesh(new THREE.SphereGeometry(1.4, 24, 16), bMat); pod.position.y = 15; spire.add(pod);
      const podRing = new THREE.Mesh(new THREE.TorusGeometry(1.42, 0.05, 8, 48), new THREE.MeshBasicMaterial({ color: 0xffc85a, fog: false })); podRing.rotation.x = Math.PI / 2; podRing.position.y = 15; spire.add(podRing);
      const tip = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff4040, fog: false })); tip.position.y = 21.5; spire.add(tip);
      const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.12, 3.5, 6), bMat); antenna.position.y = 19.8; spire.add(antenna);
      const wins = new THREE.InstancedMesh(winGeo, winMat, winList.length);
      const tmpM = new THREE.Matrix4();
      winList.forEach((p, i) => { tmpM.makeTranslation(p[0], p[1], p[2]); wins.setMatrixAt(i, tmpM); });
      sky.add(wins);

      // ---------- Schwebender Goldstaub ----------
      const NDust = 420, dustBase = [];
      for (let i = 0; i < NDust; i++) dustBase.push([(rnd() - 0.5) * 26, rnd() * 9, -14 + rnd() * 22, 0.04 + rnd() * 0.12, rnd() * 6.28]);
      const dustGeo = new THREE.BufferGeometry(); dustGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(NDust * 3), 3));
      const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0xffcf66, size: 0.05, transparent: true, opacity: 0.75, depthWrite: false }));
      scene.add(dust);

      // ---------- Zinseszins-Tabellen (7 % p. a., monatlich, 300 €/Monat) ----------
      const r = 0.07 / 12, M = 480;
      function table(m0, m1) { const v = [0], p = [0]; let x = 0, q = 0; for (let m = 0; m < M; m++) { x *= 1 + r; if (m >= m0 && m < m1) { x += 300; q += 300; } v.push(x); p.push(q); } return { v, p }; }
      const TA = table(0, 120), TB = table(120, 480);
      const at = (arr, age) => { const m = clamp((age - 25) * 12, 0, M); const i = Math.floor(m), f = m - i; return i >= M ? arr[M] : arr[i] + (arr[i + 1] - arr[i]) * f; };
      function ageAt(t) {
        if (t < B.anna.key) return 25;
        if (t < B.annastop.key) return 25 + 10 * eio(seg(t, B.anna.key, B.annastop.key));
        if (t < B.twist.start) return 35;
        return 35 + 30 * eio(seg(t, B.twist.start, B.benend.key - 0.2));
      }
      const U = 1 / 50000; // Höhe pro Euro

      // ---------- Zwei Geldtürme ----------
      const TW = 1.3, CAGE_H = 9.0;
      const bronzeMat = () => new THREE.MeshStandardMaterial({ color: 0xb4692a, emissive: 0x7a3208, emissiveIntensity: 0.18, metalness: 0.7, roughness: 0.4 });
      const boxGeo = new THREE.BoxGeometry(1, 1, 1); boxGeo.translate(0, 0.5, 0);
      function makeTower(x, name, color) {
        const g = new THREE.Group(); g.position.set(x, 0, 0); scene.add(g);
        g.add(cage(TW + 0.12, CAGE_H, TW + 0.12, 0xffc23a, 2.4, 0.9, 0.5, 4));
        const paid = new THREE.Mesh(boxGeo, bronzeMat()); g.add(paid);
        const gold = new THREE.Mesh(boxGeo, goldMat()); g.add(gold);
        const nameLab = label(name, { color, border: color, worldH: 0.42 });
        const paidLab = label("EINGEZAHLT", { color: "#ff9a4a", border: "#ff9a4a", worldH: 0.26 }); paidLab.position.set(0, 0.3, TW / 2 + 0.25); g.add(paidLab);
        const zinsLab = label("ZINSEN", { worldH: 0.3 }); zinsLab.position.set(0, 1, TW / 2 + 0.25); g.add(zinsLab);
        const res = label("–", { worldH: 0.5 }); g.add(res);
        const ring = new THREE.Mesh(new THREE.TorusGeometry(1.15, 0.04, 12, 96), new THREE.MeshBasicMaterial({ color: 0xffd23f, transparent: true }));
        ring.rotation.x = Math.PI / 2; g.add(ring);
        return { g, x, paid, gold, nameLab, paidLab, zinsLab, res, ring };
      }
      const TAx = -1.5, TBx = 1.5;
      const A = makeTower(TAx, "ANNA", "#ffd23f"), Bt = makeTower(TBx, "BEN", "#ffd23f");
      // Ergebnis-Schilder mit echten Beträgen
      function setRes(T, text, color) { const n = label(text, { color, border: color, worldH: 0.55 }); n.position.copy(T.res.position); T.g.remove(T.res); T.g.add(n); T.res = n; }
      setRes(A, "421.000 €", "#ffd23f"); setRes(Bt, "366.000 €", "#ffd23f");
      // Bens Plan (Geister-Block)
      const ghostMat = new THREE.MeshStandardMaterial({ color: 0xff9a4a, emissive: 0xff6a10, emissiveIntensity: 0.3, transparent: true, opacity: 0.0, depthWrite: false });
      const ghost = new THREE.Mesh(boxGeo, ghostMat); ghost.scale.set(TW - 0.06, 108000 * U, TW - 0.06); Bt.g.add(ghost);
      const ghostCage = cage(TW + 0.02, 108000 * U, TW + 0.02, 0xff9a4a, 2.4, 0.9, 0.36, 4); Bt.g.add(ghostCage);
      const planLab = label("PLAN: 108.000 €", { color: "#ff9a4a", border: "#ff9a4a", worldH: 0.32 }); planLab.position.set(0, 108000 * U + 0.4, 0); Bt.g.add(planLab);
      // Vergleichsringe beim „Drittel“
      const paidRingA = new THREE.Mesh(new THREE.TorusGeometry(1.1, 0.045, 12, 96), new THREE.MeshBasicMaterial({ color: 0xffd23f, transparent: true })); paidRingA.rotation.x = Math.PI / 2; A.g.add(paidRingA);
      const paidRingB = new THREE.Mesh(new THREE.TorusGeometry(1.1, 0.045, 12, 96), new THREE.MeshBasicMaterial({ color: 0xff4040, transparent: true })); paidRingB.rotation.x = Math.PI / 2; Bt.g.add(paidRingB);

      // Münzregen
      const NC = 40, COIN_DT = 0.07, FALL = 0.55;
      const coinGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.03, 20); coinGeo.rotateX(Math.PI / 2);
      const coins = new THREE.InstancedMesh(coinGeo, new THREE.MeshStandardMaterial({ color: 0xffcc44, emissive: 0xff9a1a, emissiveIntensity: 0.5, metalness: 0.8, roughness: 0.3 }), NC * 2);
      scene.add(coins);
      const coinOff = []; for (let i = 0; i < NC * 2; i++) coinOff.push([(rnd() - 0.5) * 0.9, (rnd() - 0.5) * 0.9, rnd() * 6.28, 0.7 + rnd() * 0.8]);

      // ---------- Figuren ----------
      function figure(bodyColor, accent, bun) {
        const g = new THREE.Group();
        const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.42, 0.75, 8, 24), new THREE.MeshPhysicalMaterial({ color: bodyColor, metalness: 0.2, roughness: 0.25, clearcoat: 1, clearcoatRoughness: 0.15 }));
        body.position.y = 0.82; g.add(body);
        const head = new THREE.Group(); head.position.y = 1.72; g.add(head);
        head.add(new THREE.Mesh(new THREE.SphereGeometry(0.36, 32, 24), new THREE.MeshPhysicalMaterial({ color: 0xf2f2f2, roughness: 0.2, clearcoat: 1 })));
        if (bun) { const b = new THREE.Mesh(new THREE.SphereGeometry(0.17, 20, 16), new THREE.MeshPhysicalMaterial({ color: 0xffc23a, metalness: 0.6, roughness: 0.3, clearcoat: 1 })); b.position.set(0, 0.3, -0.18); head.add(b); }
        const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.32, 0.02), new THREE.MeshBasicMaterial({ color: accent }));
        stripe.position.set(-0.08, 1.05, 0.415); g.add(stripe);
        const tick = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.05, 0.02), new THREE.MeshBasicMaterial({ color: accent }));
        tick.position.set(0.04, 1.18, 0.41); g.add(tick);
        g.userData = { body, head }; return g;
      }
      const anna = figure(0x1b2a6b, 0xffd23f, true); anna.position.set(-2.35, 0, 2.3); scene.add(anna); A.nameLab.position.set(0, 2.5, 0); anna.add(A.nameLab);
      const ben = figure(0x2b2e38, 0xff9a4a, false); ben.position.set(2.35, 0, 2.3); scene.add(ben); Bt.nameLab.position.set(0, 2.5, 0); ben.add(Bt.nameLab);
      const qMark = glyph("?", "#ffd23f", 0.75); scene.add(qMark);
      const bigQ = glyph("?", "#ffd23f", 2.6); bigQ.position.set(0, 6, -9); scene.add(bigQ);
      // Goldene Uhr („die ZEIT“)
      const clock = new THREE.Group(); clock.position.set(0, 11.2, -0.5); scene.add(clock);
      const clockMat = new THREE.MeshBasicMaterial({ color: 0xffd23f, transparent: true });
      clock.add(new THREE.Mesh(new THREE.TorusGeometry(1.3, 0.08, 16, 96), clockMat));
      for (let i = 0; i < 12; i++) { const m = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.22, 0.04), clockMat); const a = (i / 12) * Math.PI * 2; m.position.set(Math.sin(a) * 1.08, Math.cos(a) * 1.08, 0); m.rotation.z = -a; clock.add(m); }
      const handL = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.95, 0.05), clockMat); handL.geometry.translate(0, 0.45, 0); clock.add(handL);
      const handS = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.6, 0.05), clockMat); handS.geometry.translate(0, 0.28, 0); clock.add(handS);

      // ---------- Kamera-Fahrten (Zeit, Position, Ziel) ----------
      const K = [];
      const k = (t, p, tg) => K.push({ t, p: new THREE.Vector3(...p), g: new THREE.Vector3(...tg) });
      k(0.0, [0, 3.3, 15.5], [0, 2.7, 0]);
      k(B.reicher.end, [0, 3.2, 14.5], [0, 2.6, 0]);
      k(B.frage.end, [-1.4, 2.9, 9.6], [-1.9, 2.3, 1.2]);
      k(B.anna.key, [-1.3, 2.9, 9.8], [-1.7, 2.1, 0.6]);
      k(B.annastop.end, [-1.2, 3.1, 10.2], [-1.6, 2.2, 0.4]);
      k(B.ben.key, [1.4, 2.9, 9.6], [1.9, 2.3, 1.2]);
      k(B.benpaid.end, [1.2, 3.6, 11.0], [1.6, 2.8, 0.4]);
      k(B.rendite.end, [0, 3.9, 14.0], [0, 3.2, 0]);
      k(B.twist.end, [0, 4.4, 15.5], [0, 3.8, 0]);
      k(B.benend.key - 0.2, [0, 7.4, 19.5], [0, 6.6, 0]);
      k(B.benend.end, [1.6, 8.2, 11.0], [1.5, 7.4, 0]);
      k(B.annaend.key, [-1.3, 9.2, 11.0], [-1.5, 8.5, 0]);
      k(B.annaend.end, [-1.1, 9.3, 11.6], [-1.4, 8.5, 0]);
      k(B.punch.key, [0, 3.6, 15.0], [0, 2.9, 0]);
      k(B.punch.end, [0, 3.8, 15.5], [0, 3.1, 0]);
      k(B.lehre.key, [0, 9.0, 24.0], [0, 8.4, 0]);
      k(B.lehre.end, [0, 9.6, 21.5], [0, 9.2, 0]);
      k(B.T, [0, 7.4, 14.0], [0, 6.8, -6]);
      K.sort((a, b) => a.t - b.t);
      const _p = new THREE.Vector3(), _g = new THREE.Vector3();
      function camAt(t) {
        if (t <= K[0].t) { _p.copy(K[0].p); _g.copy(K[0].g); }
        else if (t >= K[K.length - 1].t) { _p.copy(K[K.length - 1].p); _g.copy(K[K.length - 1].g); }
        else for (let i = 0; i < K.length - 1; i++) if (t >= K[i].t && t <= K[i + 1].t) {
          const x = smr(seg(t, K[i].t, K[i + 1].t)); _p.lerpVectors(K[i].p, K[i + 1].p, x); _g.lerpVectors(K[i].g, K[i + 1].g, x); break;
        }
        // leichtes Handkamera-Schweben
        _p.x += Math.sin(t * 0.7) * 0.05; _p.y += Math.sin(t * 0.53 + 1) * 0.04;
        camera.position.copy(_p); camera.lookAt(_g);
      }

      // ---------- Post-Processing ----------
      const composer = new EffectComposer(renderer);
      composer.setPixelRatio(1); composer.setSize(W, H);
      composer.addPass(new RenderPass(scene, camera));
      composer.addPass(new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.55, 0.5, 0.78));
      composer.addPass(new OutputPass());

      // ---------- Bild für Zeitpunkt t (rein funktional) ----------
      const _q = new THREE.Quaternion(), _e = new THREE.Euler(), _s = new THREE.Vector3(), _c = new THREE.Vector3();
      const tmpM2 = new THREE.Matrix4();
      function setTower(T, value, paid, t) {
        const hp = Math.max(0.0001, paid * U), hv = Math.max(0.0001, (value - paid) * U);
        T.paid.scale.set(TW - 0.06, hp, TW - 0.06); T.paid.visible = paid > 1;
        T.gold.position.y = hp; T.gold.scale.set(TW - 0.06, hv, TW - 0.06); T.gold.visible = value - paid > 1;
        T.paidLab.position.y = Math.max(0.25, hp / 2); T.zinsLab.position.y = hp + Math.max(0.3, hv / 2);
        T.res.position.set(0, hp + hv + 0.55, TW / 2 + 0.2);
        return hp + hv;
      }
      function rain(slot0, x, topY, t0, t1, t) {
        for (let j = 0; j < NC; j++) {
          const o = coinOff[slot0 + j], idx = slot0 + j;
          let s = t0 + j * COIN_DT; const cyc = NC * COIN_DT;
          if (t > s) s += Math.floor((t - s) / cyc) * cyc;
          const f = (t - s) / FALL;
          if (t < t0 || s > t1 || f < 0 || f >= 1) { tmpM2.makeScale(0, 0, 0); coins.setMatrixAt(idx, tmpM2); continue; }
          _c.set(x + o[0] * 0.6, topY + 2.6 * (1 - f * f), o[1] * 0.6);
          _e.set(t * 5 * o[3] + o[2], t * 3 + o[2], 0); _q.setFromEuler(_e); _s.setScalar(1);
          tmpM2.compose(_c, _q, _s); coins.setMatrixAt(idx, tmpM2);
        }
      }
      function render(t) {
        camAt(t);
        const pa = dustGeo.attributes.position.array;
        dustBase.forEach((d, i) => { pa[i * 3] = d[0] + Math.sin(t * 0.3 + d[4]) * 0.3; pa[i * 3 + 1] = (d[1] + t * d[3]) % 9; pa[i * 3 + 2] = d[2]; });
        dustGeo.attributes.position.needsUpdate = true;

        const age = ageAt(t);
        const hA = setTower(A, at(TA.v, age), at(TA.p, age), t);
        const hB = setTower(Bt, at(TB.v, age), at(TB.p, age), t);
        // Münzen: Anna 25–35, Ben im Zeitraffer 35–65
        rain(0, TAx, hA, B.anna.key, B.annastop.key - 0.3, t);
        rain(NC, TBx, hB, B.twist.start, B.benend.key - 0.4, t);
        coins.instanceMatrix.needsUpdate = true;
        // Gold „arbeitet“: pulsiert im Zeitraffer
        const work = t > B.twist.start && t < B.benend.key ? 0.12 + 0.08 * Math.sin(t * 9) : 0;
        A.gold.material.emissiveIntensity = 0.16 + work; Bt.gold.material.emissiveIntensity = 0.16 + work;

        // Schilder
        const showPaidA = sm(seg(t, B.annastop.key, B.annastop.key + 0.3)), showPaidB = sm(seg(t, B.benend.start, B.benend.start + 0.3));
        A.paidLab.material.opacity = showPaidA * (1 - sm(seg(t, B.lehre.start, B.lehre.start + 0.4)));
        Bt.paidLab.material.opacity = showPaidB * (1 - sm(seg(t, B.lehre.start, B.lehre.start + 0.4)));
        const zins = sm(seg(t, B.rendite.key, B.rendite.key + 0.4)) * (1 - sm(seg(t, B.punch.start, B.punch.start + 0.3)));
        A.zinsLab.material.opacity = zins; Bt.zinsLab.material.opacity = zins * sm(seg(t, B.benend.start, B.benend.start + 0.3));
        const popRes = (T, k0) => { const x = seg(t, k0, k0 + 0.35); T.res.visible = x > 0; T.res.scale.copy(T.res.userData.base).multiplyScalar(eout(x) * (1 + 0.25 * Math.sin(x * Math.PI))); };
        A.res.visible = Bt.res.visible = false;
        A.res.material.opacity = Bt.res.material.opacity = 1 - sm(seg(t, B.lehre.start, B.lehre.start + 0.4));
        // Sieger-Ring oben bei Anna
        const win = sm(seg(t, B.annaend.key + 0.2, B.annaend.key + 0.6)) * (1 - sm(seg(t, B.punch.start, B.punch.start + 0.3)));
        A.ring.position.y = hA + 0.05; A.ring.material.opacity = win; A.ring.visible = win > 0.01;
        const rs = 1 + 0.06 * Math.sin(t * 7); A.ring.scale.set(rs, rs, rs); Bt.ring.visible = false;
        // „Drittel“: Einzahlungen vergleichen
        const pr = sm(seg(t, B.punch.key - 0.2, B.punch.key + 0.2)) * (1 - sm(seg(t, B.lehre.start, B.lehre.start + 0.3)));
        paidRingA.position.y = 36000 * U; paidRingB.position.y = 108000 * U;
        paidRingA.material.opacity = paidRingB.material.opacity = pr; paidRingA.visible = paidRingB.visible = pr > 0.01;
        const pp = 1 + 0.06 * Math.sin(t * 8) * pr; paidRingA.scale.set(pp, pp, pp); paidRingB.scale.set(pp, pp, pp);
        // Bens Plan-Geist
        const gh = sm(seg(t, B.benpaid.key - 0.1, B.benpaid.key + 0.4)) * (1 - sm(seg(t, B.twist.start, B.twist.start + 0.5)));
        const ghGrow = eout(seg(t, B.ben.key, B.benpaid.key + 0.4));
        ghost.scale.y = Math.max(0.001, 108000 * U * ghGrow); ghostMat.opacity = 0.35 * Math.max(gh, ghGrow * (1 - sm(seg(t, B.twist.start, B.twist.start + 0.5))));
        ghost.visible = ghostCage.visible = ghostMat.opacity > 0.01; ghostCage.material.opacity = gh;
        planLab.visible = gh > 0.01; planLab.material.opacity = gh;
        // Namen

        // Figuren
        for (const [f, tx, act0, act1] of [[anna, TAx, B.anna.start, B.annastop.end], [ben, TBx, B.ben.start, B.benpaid.end]]) {
          f.userData.body.scale.set(1, 1 + Math.sin(t * 2.2 + tx) * 0.02, 1);
          let yaw = Math.sin(t * 0.8 + tx) * 0.06;
          const act = sm(seg(t, act0, act0 + 0.4)) * (1 - sm(seg(t, act1, act1 + 0.4)));
          yaw = lerp(yaw, Math.atan2(tx - f.position.x, 0 - f.position.z), act);
          const up = sm(seg(t, B.benend.start, B.benend.start + 0.6)) * (1 - sm(seg(t, B.lehre.start, B.lehre.start + 0.6)));
          f.userData.head.rotation.x = -0.45 * up; // schauen nach oben auf die Türme
          f.rotation.y = lerp(yaw, Math.atan2(tx - f.position.x, 0 - f.position.z) * 0.6, up);
        }
        // Ben ärgert sich, Anna jubelt (hüpft)
        const jump = t > B.annaend.key ? Math.abs(Math.sin((t - B.annaend.key) * 7)) * 0.25 * (1 - seg(t, B.annaend.key + 1.6, B.annaend.key + 2.0)) : 0;
        anna.position.y = jump;
        const sad = sm(seg(t, B.annaend.key, B.annaend.key + 0.5)) * (1 - sm(seg(t, B.lehre.start, B.lehre.start + 0.5)));
        ben.rotation.x = sad * 0.14;
        const qa = sm(seg(t, B.frage.start, B.frage.start + 0.35)) * (1 - sm(seg(t, B.anna.start, B.anna.start + 0.3)));
        qMark.visible = qa > 0.01; qMark.material.opacity = qa;
        qMark.position.set(anna.position.x + 0.55, 3.0 + Math.sin(t * 3) * 0.06, anna.position.z);
        qMark.scale.copy(qMark.userData.base).multiplyScalar(0.5 + 0.5 * eout(qa));

        // Uhr
        const ck = eout(seg(t, B.lehre.key - 0.3, B.lehre.key + 0.4)) * (1 - sm(seg(t, B.cta.start + 0.3, B.cta.start + 0.9)));
        clock.visible = ck > 0.01; clockMat.opacity = ck; clock.scale.setScalar(0.4 + 0.6 * ck);
        handL.rotation.z = -t * 6; handS.rotation.z = -t * 0.5;

        // Teil 2
        const bq = eout(seg(t, B.cta.start + 0.4, B.cta.start + 1.4));
        bigQ.visible = bq > 0; bigQ.material.opacity = bq;
        bigQ.position.y = 5.6 + bq * 0.8 + Math.sin(t * 2.5) * 0.12;
        bigQ.scale.copy(bigQ.userData.base).multiplyScalar(0.4 + 0.6 * bq);

        composer.render();
      }

      // ---------- Bereitschaft ----------
      renderer.compile(scene, camera);
      ready = true; render(lastT); resolveReady();
    </script>
  </body>
</html>
