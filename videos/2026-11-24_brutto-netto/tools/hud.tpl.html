<template>
  <style>
    #root { position: absolute; inset: 0; font-family: "Montserrat"; pointer-events: none; }
    #hud-bar { position: absolute; left: 120px; width: 768px; top: 292px; height: 230px; text-align: center; }
    #hud-label { color: #fff; font-weight: 800; font-size: 30px; letter-spacing: 0.32em; text-shadow: 0 2px 10px rgba(0,0,0,.9); }
    #hud-num { display: block; margin-top: 2px; font-weight: 900; font-size: 104px; line-height: 1.05; color: #ffd23f;
      font-variant-numeric: tabular-nums; -webkit-text-stroke: 3px rgba(60,30,0,.9); paint-order: stroke fill;
      text-shadow: 0 0 22px rgba(255,200,40,.85), 0 0 60px rgba(255,150,0,.55); transform-origin: 50% 60%; }
    #hud-delta { display: block; margin-top: 4px; font-weight: 900; font-size: 46px; color: #ff4848;
      text-shadow: 0 0 18px rgba(255,40,40,.9), 0 2px 8px rgba(0,0,0,.9); }
    #hud-src { position: absolute; left: 120px; width: 660px; top: 1196px; text-align: center; font-weight: 700; font-size: 28px;
      color: rgba(255,255,255,.62); text-shadow: 0 2px 6px rgba(0,0,0,1); }
  </style>
  <div id="root" data-composition-id="hud" data-width="1080" data-height="1920">
    <div id="hud-bar" class="clip" data-start="0" data-duration="__D__" data-track-index="0">
      <div id="hud-label">DEIN GEHALT</div>
      <span id="hud-num">4.000 €</span>
      <span id="hud-delta">&nbsp;</span>
    </div>
    <div id="hud-src" class="clip" data-start="0.2" data-duration="__SRCDUR__" data-track-index="1">StKl. 1 · ohne Kinder/Kirche · 2026, gerundet</div>
  </div>
  <script>
    (function () {
      const B = __BEATS__;
      const DEDS = __DEDS__;
      const lab = document.getElementById("hud-label"), num = document.getElementById("hud-num"), del = document.getElementById("hud-delta");
      const clamp = (x) => Math.min(1, Math.max(0, x)), seg = (t, a, b) => clamp((t - a) / (b - a));
      const eout = (x) => 1 - Math.pow(1 - x, 3);
      const fmt = (v) => Math.round(v).toLocaleString("de-DE") + " €";
      const GOLD = [255, 210, 63], RED = [255, 72, 72], ORANGE = [255, 166, 64];
      const mix = (a, b, x) => `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * x)).join(",")})`;
      function state(t) {
        let label = "DEIN GEHALT", text, color = GOLD, pulse = 0, delta = "", dA = 0, shake = 0;
        let v = 4000;
        for (const d of DEDS) {
          const x = eout(seg(t, d.k, d.k + 0.7)); v -= d.amt * x;
          const since = t - d.k;
          if (since >= 0 && since < 1.9) { delta = "−" + d.amt + " € " + d.name; dA = Math.min(1, since / 0.12) * (1 - seg(t, d.k + 1.5, d.k + 1.9)); color = mix(RED, GOLD, seg(t, d.k + 0.3, d.k + 1.1)); shake = 1 - seg(t, d.k, d.k + 0.4); }
        }
        text = fmt(v);
        if (t >= B.netto.start) { label = "NETTO"; color = GOLD; pulse = Math.sin(seg(t, B.netto.key, B.netto.key + 0.5) * Math.PI); }
        if (t >= B.chef.start) {
          label = "DEIN JOB KOSTET DEN CHEF";
          const a = eout(seg(t, B.chef.key, B.chef.key + 0.9)), b = eout(seg(t, B.kosten.key, B.kosten.key + 0.8));
          text = fmt(4000 + 850 * a + 50 * b);
          color = mix(GOLD, ORANGE, a);
          pulse = Math.sin(seg(t, B.chef.start, B.chef.start + 0.35) * Math.PI) * 0.6 + Math.sin(seg(t, B.chef.key + 0.8, B.chef.key + 1.2) * Math.PI);
          if (t > B.chef.key && t < B.chef.key + 2.2) { delta = "+850 € Arbeitgeber"; dA = Math.min(1, (t - B.chef.key) / 0.12) * (1 - seg(t, B.chef.key + 1.8, B.chef.key + 2.2)); }
        }
        if (t >= B.haelfte.start) {
          label = "BEI DIR KOMMEN AN";
          const p = 100 - 47 * eout(seg(t, B.haelfte.key - 0.6, B.haelfte.key + 0.4));
          text = Math.round(p) + " %"; color = mix(GOLD, RED, seg(t, B.haelfte.key - 0.6, B.haelfte.key + 0.4));
          pulse = Math.sin(seg(t, B.haelfte.key + 0.4, B.haelfte.key + 0.9) * Math.PI);
          if (t > B.haelfte.key) { delta = "2.605 € von 4.900 €"; dA = Math.min(1, (t - B.haelfte.key) / 0.15); }
        }
        if (t >= B.cta.start) { label = "FOLGEN FÜR"; text = "TEIL 2"; color = GOLD; delta = ""; pulse = Math.sin(seg(t, B.cta.start, B.cta.start + 0.4) * Math.PI); }
        return { label, text, color, pulse, delta, dA, shake };
      }
      const tl = gsap.timeline({ paused: true });
      const proxy = { x: 0 };
      tl.to(proxy, {
        x: 1, duration: __D__, ease: "none",
        onUpdate: () => {
          const t = tl.time(), s = state(t);
          lab.textContent = s.label; num.textContent = s.text; num.style.color = Array.isArray(s.color) ? mix(s.color, s.color, 0) : s.color;
          const sx = s.shake ? Math.sin(t * 90) * 7 * s.shake : 0;
          num.style.transform = `translateX(${sx}px) scale(${1 + 0.12 * s.pulse})`;
          del.textContent = s.delta || " "; del.style.opacity = s.dA;
          del.style.color = s.delta.startsWith("+") ? "#ffa640" : "#ff4848";
        },
      }, 0);
      window.__timelines["hud"] = tl;
    })();
  </script>
</template>
