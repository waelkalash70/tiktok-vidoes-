<template>
  <style>
    #root { position: absolute; inset: 0; font-family: "Montserrat"; pointer-events: none; }
    #hud-bar { position: absolute; left: 120px; width: 768px; top: 292px; height: 230px; text-align: center; }
    #hud-bar::before { content: ""; position: absolute; left: -60px; right: -60px; top: -40px; bottom: -10px; z-index: 0;
      background: radial-gradient(ellipse at 50% 45%, rgba(3,4,9,.78) 0%, rgba(3,4,9,.55) 45%, rgba(3,4,9,0) 72%); }
    #hud-label, #hud-num, #hud-delta { position: relative; z-index: 1; }
    #hud-label { color: #fff; font-weight: 800; font-size: 28px; letter-spacing: 0.26em; text-shadow: 0 2px 10px rgba(0,0,0,.9); }
    #hud-num { display: block; margin-top: 2px; font-weight: 900; font-size: 96px; line-height: 1.05; color: #ffd23f; white-space: nowrap;
      font-variant-numeric: tabular-nums; -webkit-text-stroke: 3px rgba(60,30,0,.9); paint-order: stroke fill;
      text-shadow: 0 0 22px rgba(255,200,40,.85), 0 0 60px rgba(255,150,0,.55); transform-origin: 50% 60%; }
    #hud-delta { display: block; margin-top: 4px; font-weight: 900; font-size: 40px; color: #ffa640; white-space: nowrap;
      text-shadow: 0 0 18px rgba(255,140,40,.8), 0 2px 8px rgba(0,0,0,.9); }
    .hud-src { position: absolute; left: 120px; width: 660px; top: 1186px; text-align: center; font-weight: 700; font-size: 28px;
      color: rgba(255,255,255,.62); text-shadow: 0 2px 6px rgba(0,0,0,1); white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="hud" data-width="1080" data-height="1920">
    <div id="hud-bar" class="clip" data-start="0" data-duration="__D__" data-track-index="0">
      <div id="hud-label">GTA 6 · TAG 1</div>
      <span id="hud-num">0 $</span>
      <span id="hud-delta">&nbsp;</span>
    </div>
    <div id="hud-src" class="hud-src clip" data-start="0.2" data-duration="__SRCDUR__" data-track-index="1">Quelle: Take-Two · Schätzung Tag 1</div>
    <div id="hud-src2" class="hud-src clip" data-start="__SRC2START__" data-duration="__SRC2DUR__" data-track-index="1">Tempo von Tag 1 · keine Live-Daten</div>
  </div>
  <script>
    (function () {
      const B = __BEATS__;
      const RATE = 3790000000 / 86400; // 43.866 $ pro Sekunde
      const lab = document.getElementById("hud-label"), num = document.getElementById("hud-num"), del = document.getElementById("hud-delta");
      const clamp = (x) => Math.min(1, Math.max(0, x)), seg = (t, a, b) => clamp((t - a) / (b - a));
      const eout = (x) => 1 - Math.pow(1 - x, 3);
      const usd = (v) => Math.round(v).toLocaleString("de-DE") + " $";
      const GOLD = "rgb(255,210,63)", RED = "rgb(255,72,72)", ORANGE = "rgb(255,166,64)";
      function state(t) {
        let label = "GTA 6 · TAG 1", text, color = GOLD, pulse = 0, delta = "", dA = 0, dColor = ORANGE;
        text = usd(t < B.hook.key ? 1e7 + 3e8 * t : 3.1e8 + (3790000000 - 3.1e8) * eout(seg(t, B.hook.key, B.hook.key + 1.6)));
        pulse = Math.sin(seg(t, B.hook.key + 1.5, B.hook.key + 1.9) * Math.PI);
        if (t >= B.sekunde.start) {
          label = "PRO SEKUNDE"; text = t < B.sekunde.key ? "? $" : usd(Math.round(43866 * eout(seg(t, B.sekunde.key - 0.05, B.sekunde.key + 0.6))));
          pulse = Math.sin(seg(t, B.sekunde.key + 0.6, B.sekunde.key + 1.0) * Math.PI); color = GOLD;
          delta = "3,79 Mrd. $ ÷ 86.400 Sekunden"; dA = seg(t, B.sekunde.key + 0.3, B.sekunde.key + 0.5);
        }
        if (t >= B.live.start) {
          label = "WÄHREND DU ZUSCHAUST"; text = usd(RATE * t); delta = "";
          pulse = Math.sin(seg(t, B.live.key, B.live.key + 0.4) * Math.PI) * 1.2;
          // Abschnitts-Fakten in der Zeile darunter
          const facts = [["gta5", "GTA 5 (2013): 800 Mio. $ an Tag 1"], ["endgame", "Endgame: 1,2 Mrd. $ in 3 Tagen"],
                         ["dreifach", "GTA 6: 3,79 Mrd. $ an 1 Tag"], ["grund", "32,5 Mio. Vorbestellungen"], ["punch", "= 43.866 $ pro Sekunde"]];
          for (const [b, txt] of facts) if (t >= B[b].key) { delta = txt; dA = seg(t, B[b].key, B[b].key + 0.15); }
          if (t >= B.twist.start && t < B.endgame.key) { delta = ""; }
          if (t >= B.punch.key) { pulse = 0.5 + 0.5 * Math.sin(t * 8); }
        }
        if (t >= B.cta.start) { label = "FOLGEN FÜR"; text = "TEIL 2"; delta = "Wer bekommt das Geld?"; dA = 1; pulse = Math.sin(seg(t, B.cta.start, B.cta.start + 0.4) * Math.PI); }
        return { label, text, color, pulse, delta, dA, dColor };
      }
      const tl = gsap.timeline({ paused: true });
      tl.to({ x: 0 }, {
        x: 1, duration: __D__, ease: "none",
        onUpdate: () => {
          const t = tl.time(), s = state(t);
          lab.textContent = s.label; num.textContent = s.text; num.style.color = s.color;
          num.style.fontSize = s.text.length > 13 ? "68px" : s.text.length > 10 ? "84px" : "96px";
          num.style.transform = `scale(${1 + 0.1 * s.pulse})`;
          del.textContent = s.delta || " "; del.style.opacity = s.dA; del.style.color = s.dColor;
        },
      }, 0);
      window.__timelines["hud"] = tl;
    })();
  </script>
</template>
