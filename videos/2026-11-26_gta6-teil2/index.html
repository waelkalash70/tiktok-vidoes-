    <script type="module">
      import * as THREE from "three";

      const B = {"hook": {"start": 0.0, "end": 5.667, "key": 1.68}, "recap": {"start": 5.667, "end": 11.426, "key": 6.381}, "steuer": {"start": 11.426, "end": 16.175, "key": 14.79}, "plattform": {"start": 16.175, "end": 21.355, "key": 20.067}, "twist": {"start": 21.355, "end": 22.787, "key": 22.067}, "code": {"start": 22.787, "end": 25.969, "key": 23.795}, "tempo": {"start": 25.969, "end": 30.391, "key": 27.27}, "rest": {"start": 30.391, "end": 33.535, "key": 32.245}, "punch": {"start": 33.535, "end": 37.507, "key": 33.819}, "cta": {"start": 37.507, "end": 41.871, "key": 38.825}, "T": 42.77};
      const W = 1080, H = 1920;

      // ---------- Hilfsfunktionen ----------
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const seg = (t, a, b) => clamp((t - a) / (b - a));
      const sm = (x) => x * x * (3 - 2 * x);

      const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const eout = (x) => 1 - Math.pow(1 - x, 3);
      const lerp = (a, b, x) => a + (b - a) * x;
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const rnd = mulberry32(20261124);

      // ---------- Renderer ----------
      const canvas = document.getElementById("world");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);

      scene.environmentIntensity = 0.35;

      const camera = new THREE.PerspectiveCamera(44, W / H, 0.1, 200);

      scene.add(new THREE.HemisphereLight(0x22335a, 0x000000, 0.5));
      const key = new THREE.DirectionalLight(0xffdcaa, 2.2); key.position.set(5, 9, 7); scene.add(key);
      const rim = new THREE.DirectionalLight(0x5f7dff, 1.4); rim.position.set(-6, 5, -7); scene.add(rim);
      const towerLight = new THREE.PointLight(0xffaa33, 2.5, 9, 2); towerLight.position.set(3.2, 2.4, 5.0); scene.add(towerLight);

      // ---------- Materialien ----------
      const GOLD = 0xffc23a;
      const goldMat = () => new THREE.MeshStandardMaterial({ color: GOLD, emissive: 0xff8a10, emissiveIntensity: 0.16, metalness: 0.75, roughness: 0.34 });
      const lineMat = (color, width, opacity) => {
        const m = new LineMaterial({ color, linewidth: width, transparent: true, opacity, worldUnits: false });
        m.resolution.set(W, H); return m;
      };

      // Gitter-Käfig (wie Referenz): Kanten, Ringe alle `step`, senkrechte Teilungen je Seite
      function cagePositions(w, h, d, step = 0.5, div = 3) {
        const p = [], x0 = -w / 2, x1 = w / 2, z0 = -d / 2, z1 = d / 2;
        const L = (a, b) => p.push(...a, ...b);
        const rings = Math.max(1, Math.round(h / step));
        for (let i = 0; i <= rings; i++) { const y = (h * i) / rings; L([x0, y, z0], [x1, y, z0]); L([x1, y, z0], [x1, y, z1]); L([x1, y, z1], [x0, y, z1]); L([x0, y, z1], [x0, y, z0]); }
        for (let i = 0; i <= div; i++) {
          const fx = lerp(x0, x1, i / div), fz = lerp(z0, z1, i / div);
          L([fx, 0, z0], [fx, h, z0]); L([fx, 0, z1], [fx, h, z1]); L([x0, 0, fz], [x0, h, fz]); L([x1, 0, fz], [x1, h, fz]);
        }
        return p;
      }
      function cage(w, h, d, color, width, opacity, step, div) {
        const g = new LineSegmentsGeometry(); g.setPositions(cagePositions(w, h, d, step, div));
        return new LineSegments2(g, lineMat(color, width, opacity));
      }

      // Text-Schild als Sprite (Badge wie „FIRMA 1“ in der Referenz)
      function label(text, { color = "#ffd23f", border = color, size = 64, worldH = 0.42, bg = "rgba(5,6,10,0.82)", weight = 900, pad = 0.42 } = {}) {
        const c = document.createElement("canvas"), x = c.getContext("2d");
        const font = `${weight} ${size}px Montserrat`;
        x.font = font; const tw = Math.ceil(x.measureText(text).width);
        const ph = Math.round(size * pad), cw = tw + ph * 2 + 8, ch = Math.round(size * 1.5);
        c.width = cw; c.height = ch;
        x.font = font; x.textBaseline = "middle"; x.textAlign = "center";
        const r = ch * 0.22;
        x.beginPath(); x.roundRect(4, 4, cw - 8, ch - 8, r); x.fillStyle = bg; x.fill();
        x.lineWidth = 6; x.strokeStyle = border; x.stroke();
        x.fillStyle = color; x.shadowColor = color; x.shadowBlur = 18; x.fillText(text, cw / 2, ch / 2 + size * 0.04);
        const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
        const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, fog: false }));
        s.scale.set((worldH * cw) / ch, worldH, 1); s.userData.base = s.scale.clone();
        return s;
      }
      function glyph(text, color, worldH) {
        const c = document.createElement("canvas"), x = c.getContext("2d"); c.width = 256; c.height = 256;
        x.font = "900 220px Montserrat"; x.textAlign = "center"; x.textBaseline = "middle";
        x.fillStyle = color; x.shadowColor = color; x.shadowBlur = 30; x.fillText(text, 128, 140);
        const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
        const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, fog: false }));
        s.scale.set(worldH, worldH, 1); s.userData.base = s.scale.clone(); return s;
      }

      // ---------- Boden: Spiegelung + Goldraster ----------
      const mirror = new Reflector(new THREE.PlaneGeometry(140, 140), { textureWidth: 540, textureHeight: 960, color: 0x8a8a8a, clipBias: 0.003 });
      mirror.rotation.x = -Math.PI / 2; scene.add(mirror);
      const dim = new THREE.Mesh(new THREE.PlaneGeometry(140, 140), new THREE.MeshBasicMaterial({ color: 0x030409, transparent: true, opacity: 0.74 }));
      dim.rotation.x = -Math.PI / 2; dim.position.y = 0.004; scene.add(dim);
      const grid = new THREE.GridHelper(80, 80, 0x5a4214, 0x2a1f0a); grid.position.y = 0.008;
      grid.material.transparent = true; grid.material.opacity = 0.32; scene.add(grid);

      // ---------- Skyline im Hintergrund ----------
      const sky = new THREE.Group(); scene.add(sky);
      const bMat = new THREE.MeshStandardMaterial({ color: 0x07080d, roughness: 0.8, metalness: 0.2 });
      const winGeo = new THREE.PlaneGeometry(0.13, 0.17);
      const winMat = new THREE.MeshBasicMaterial({ color: 0x9a6a22, fog: false });
      const winList = [];
      for (let i = 0; i < 34; i++) {
        const w = 1.0 + rnd() * 1.6, d = 1.0 + rnd() * 1.2;
        const cx = -24 + i * 1.45 + (rnd() - 0.5) * 0.6;
        const center = 1 - Math.min(1, Math.abs(cx) / 24);
        const h = 2.5 + rnd() * 6 + center * 6;
        const z = -44 - rnd() * 8;
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), bMat); m.position.set(cx, h / 2, z); sky.add(m);
        const e = cage(w, h, d, 0x9a7426, 1.4, 0.45, 100, 1); e.position.set(cx, 0, z); sky.add(e);
        for (let fy = 0.6; fy < h - 0.4; fy += 0.5) for (let fx = -w / 2 + 0.3; fx < w / 2 - 0.2; fx += 0.34)
          if (rnd() < 0.2) winList.push([cx + fx, fy, z + d / 2 + 0.01]);
      }
      // Wahrzeichen: generischer Fernsehturm
      const spire = new THREE.Group(); spire.position.set(6, 0, -52); sky.add(spire);
      const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.7, 18, 12), bMat); shaft.position.y = 9; spire.add(shaft);
      const pod = new THREE.Mesh(new THREE.SphereGeometry(1.4, 24, 16), bMat); pod.position.y = 15; spire.add(pod);
      const podRing = new THREE.Mesh(new THREE.TorusGeometry(1.42, 0.05, 8, 48), new THREE.MeshBasicMaterial({ color: 0xffc85a, fog: false })); podRing.rotation.x = Math.PI / 2; podRing.position.y = 15; spire.add(podRing);
      const tip = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff4040, fog: false })); tip.position.y = 21.5; spire.add(tip);
      const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.12, 3.5, 6), bMat); antenna.position.y = 19.8; spire.add(antenna);
      const wins = new THREE.InstancedMesh(winGeo, winMat, winList.length);
      const tmpM = new THREE.Matrix4();
      winList.forEach((p, i) => { tmpM.makeTranslation(p[0], p[1], p[2]); wins.setMatrixAt(i, tmpM); });
      sky.add(wins);

      // ---------- Schwebender Goldstaub ----------
      const NDust = 420, dustBase = [];
      for (let i = 0; i < NDust; i++) dustBase.push([(rnd() - 0.5) * 26, rnd() * 9, -14 + rnd() * 22, 0.04 + rnd() * 0.12, rnd() * 6.28]);
      const dustGeo = new THREE.BufferGeometry(); dustGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(NDust * 3), 3));
      const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0xffcf66, size: 0.05, transparent: true, opacity: 0.75, depthWrite: false }));
      scene.add(dust);

      // ---------- Daten: 79,99 € digital in Deutschland ----------
      const SC = 1 / 20;                       // 1 Höheneinheit = 20 €
      const NET = 47.05 * SC, TOTAL = 79.99 * SC;
      const TX = 0, TZ = 0, TW = 1.5;
      const boxGeo = new THREE.BoxGeometry(1, 1, 1); boxGeo.translate(0, 0.5, 0);
      const tower = new THREE.Group(); tower.position.set(TX, 0, TZ); scene.add(tower);
      const towerCage = cage(TW + 0.12, TOTAL, TW + 0.12, 0xffc23a, 2.6, 0.95, 0.4, 4); tower.add(towerCage);
      const netMesh = new THREE.Mesh(boxGeo, goldMat()); netMesh.scale.set(TW - 0.06, NET, TW - 0.06); tower.add(netMesh);
      const priceLab = label("GTA 6 · 79,99 €", { worldH: 0.4 }); priceLab.position.set(0, TOTAL + 0.5, 0); tower.add(priceLab);

      const ring = new THREE.Mesh(new THREE.TorusGeometry(1.25, 0.04, 12, 96), new THREE.MeshBasicMaterial({ color: 0xffd23f, transparent: true }));

      // „Weg“-Bereich beim Punch (rot, durchsichtig)
      const goneMat = new THREE.MeshBasicMaterial({ color: 0xff3030, transparent: true, opacity: 0, depthWrite: false });
      const gone = new THREE.Mesh(boxGeo, goneMat); gone.scale.set(TW - 0.04, TOTAL - NET, TW - 0.04); gone.position.y = NET; tower.add(gone);
      const goneLab = label("−41 %", { color: "#ff4b4b", border: "#ff4b4b", worldH: 0.55 }); goneLab.position.set(0, NET + (TOTAL - NET) / 2, TW / 2 + 0.35); tower.add(goneLab);
      // Abzüge (oben zuerst): Stapel von unten: NET, Plattform, Steuer
      const D = [
        { beat: "plattform", amt: 20.17, name: "SONY / MICROSOFT", pos: [3.7, 0, -2.6] },
        { beat: "steuer", amt: 12.77, name: "STAAT", pos: [-3.9, 0, -2.8] },
      ];
      let y0 = NET; const FL = 1.25, CW = 1.4, CH = 1.6;
      for (const d of D) {
        d.h = d.amt * SC; d.y = y0; y0 += d.h; d.k = B[d.beat].key;
        d.mat = goldMat(); d.mesh = new THREE.Mesh(boxGeo, d.mat); scene.add(d.mesh);
        d.cage = new THREE.Group(); d.cage.position.set(...d.pos); scene.add(d.cage);
        d.cage.add(cage(CW, CH, CW, 0xffb52e, 2.2, 0.85, 0.4, 3));

        d.amtLab = label("−" + d.amt.toFixed(2).replace(".", ",") + " €", { worldH: 0.3 }); d.amtLab.position.set(0, CH + 0.88, 0); d.cage.add(d.amtLab);
      }
      const P = D[0]; // Plattform
      const codeLab = label("0 ZEILEN CODE", { color: "#ff4b4b", border: "#ff4b4b", worldH: 0.36 }); codeLab.position.set(0, CH + 1.4, 0); P.cage.add(codeLab);
      // Münzen: Abflug-Schwarm + Dauerstrom zur Plattform
      const NC = 16, NS = 40;
      const coinGeo = new THREE.CylinderGeometry(0.11, 0.11, 0.03, 20); coinGeo.rotateX(Math.PI / 2);
      const coins = new THREE.InstancedMesh(coinGeo, new THREE.MeshStandardMaterial({ color: 0xffcc44, emissive: 0xff9a1a, emissiveIntensity: 0.5, metalness: 0.8, roughness: 0.3 }), D.length * NC + NS);
      scene.add(coins);
      const coinOff = []; for (let i = 0; i < D.length * NC + NS; i++) coinOff.push([(rnd() - 0.5) * 1.1, (rnd() - 0.5) * 0.8, (rnd() - 0.5) * 1.1, rnd() * 0.32, rnd() * 6.28, 0.6 + rnd() * 0.8, rnd()]);
      // Stoppuhr über der Plattform
      const watch = new THREE.Group(); scene.add(watch);
      const wMat = new THREE.MeshBasicMaterial({ color: 0xffd23f, transparent: true });
      watch.add(new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.05, 16, 80), wMat));
      const crown = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.18, 0.06), wMat); crown.position.y = 0.74; watch.add(crown);
      for (let i = 0; i < 12; i++) { const m = new THREE.Mesh(new THREE.BoxGeometry(0.035, i % 3 ? 0.08 : 0.15, 0.03), wMat); const a = i / 12 * Math.PI * 2; m.position.set(Math.sin(a) * 0.48, Math.cos(a) * 0.48, 0); m.rotation.z = -a; watch.add(m); }
      const hand = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.45, 0.03), new THREE.MeshBasicMaterial({ color: 0xff4040, transparent: true })); hand.geometry.translate(0, 0.21, 0); watch.add(hand);
      const perSec = label("+13.000 $ / Sek.", { worldH: 0.24 }); perSec.position.set(0, -0.85, 0); watch.add(perSec);
      // Figur mit Gamepad
      function figure(bodyColor) {
        const g = new THREE.Group();
        const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.42, 0.75, 8, 24), new THREE.MeshPhysicalMaterial({ color: bodyColor, metalness: 0.2, roughness: 0.25, clearcoat: 1, clearcoatRoughness: 0.15 }));
        body.position.y = 0.82; g.add(body);
        const head = new THREE.Group(); head.position.y = 1.72; g.add(head);
        head.add(new THREE.Mesh(new THREE.SphereGeometry(0.36, 32, 24), new THREE.MeshPhysicalMaterial({ color: 0xc9cbd2, roughness: 0.32, clearcoat: 1 })));
        const pad = new THREE.Group(); pad.position.set(0, 0.95, 0.5); g.add(pad);
        const pm = new THREE.MeshPhysicalMaterial({ color: 0x111318, roughness: 0.35, clearcoat: 1 });
        pad.add(new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.18, 0.14), pm));
        for (const sx of [-1, 1]) { const gr = new THREE.Mesh(new THREE.CapsuleGeometry(0.08, 0.14, 6, 12), pm); gr.position.set(sx * 0.24, -0.1, 0); gr.rotation.z = sx * 0.5; pad.add(gr); }
        for (const [bx, by, c] of [[0.13, 0.03, 0xffd23f], [0.18, -0.02, 0xff4040], [-0.15, 0.0, 0x5f7dff]]) { const b = new THREE.Mesh(new THREE.SphereGeometry(0.03, 10, 8), new THREE.MeshBasicMaterial({ color: c })); b.position.set(bx, by, 0.075); pad.add(b); }
        g.userData = { body, head, pad }; return g;
      }
      const FX = 1.55, FZ = 1.9;
      const hero = figure(0x1b2a6b); hero.position.set(FX, 0, FZ); scene.add(hero);
      const qMark = glyph("?", "#ffd23f", 0.75); scene.add(qMark);
      // CTA: digital oder Laden
      const digLab = label("DIGITAL", { worldH: 0.5 }); scene.add(digLab);
      const shopLab = label("IM LADEN", { worldH: 0.5 }); scene.add(shopLab);
      const bigQ = glyph("?", "#ffd23f", 1.8); scene.add(bigQ);

      // ---------- Kamera ----------
      const K = [];
      const k = (t, p, tg) => K.push({ t, p: new THREE.Vector3(...p), g: new THREE.Vector3(...tg) });
      k(0.0, [0.9, 2.6, 10.5], [0.2, 2.5, 0]);
      k(B.hook.end, [1.2, 2.5, 8.6], [0.6, 2.2, 0.6]);
      k(B.recap.end, [0.6, 3.6, 12.5], [0.0, 2.8, -1]);
      for (const d of [...D].reverse()) {
        const [cx, , cz] = d.pos;
        k(d.k - 0.15, [0.3, 4.6, 12.5], [0, 2.6, -1.2]);
        k(d.k + FL * 0.95, [cx * 0.8, 3.4, cz + 8.0], [cx * 0.97, 1.75, cz]);
        k(d.k + FL + 0.35, [cx * 0.8, 3.5, cz + 7.7], [cx * 0.97, 1.75, cz]);
      }
      k(Math.max(B.twist.start, P.k + FL + 0.6), [3.1, 5.3, 7.6], [3.6, 4.7, -2.6]);
      k(B.code.end, [3.1, 5.3, 7.4], [3.6, 4.6, -2.6]);
      k(B.tempo.key, [3.0, 5.0, 7.8], [3.6, 4.3, -2.6]);
      k(B.tempo.end, [2.9, 5.1, 8.2], [3.5, 4.4, -2.6]);
      k(B.rest.key, [0.6, 2.6, 8.4], [0.0, 2.2, 0]);
      k(B.rest.end, [0.7, 2.7, 8.8], [0.0, 2.3, 0]);
      k(B.punch.key, [0.4, 3.4, 10.4], [0.0, 2.9, 0]);
      k(B.punch.end, [0.4, 3.5, 10.8], [0.0, 3.0, 0]);
      k(B.T, [0, 4.6, 13.5], [0, 3.8, -1]);
      K.sort((a, b) => a.t - b.t);
      const _p = new THREE.Vector3(), _g = new THREE.Vector3();
      function camAt(t) {
        if (t <= K[0].t) { _p.copy(K[0].p); _g.copy(K[0].g); }
        else if (t >= K[K.length - 1].t) { _p.copy(K[K.length - 1].p); _g.copy(K[K.length - 1].g); }
        else for (let i = 0; i < K.length - 1; i++) if (t >= K[i].t && t <= K[i + 1].t) {
          const x = smr(seg(t, K[i].t, K[i + 1].t)); _p.lerpVectors(K[i].p, K[i + 1].p, x); _g.lerpVectors(K[i].g, K[i + 1].g, x); break;
        }
        // leichtes Handkamera-Schweben
        _p.x += Math.sin(t * 0.7) * 0.05; _p.y += Math.sin(t * 0.53 + 1) * 0.04;
        camera.position.copy(_p); camera.lookAt(_g);
      }

      // ---------- Post-Processing ----------
      const composer = new EffectComposer(renderer);
      composer.setPixelRatio(1); composer.setSize(W, H);
      composer.addPass(new RenderPass(scene, camera));
      composer.addPass(new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.55, 0.5, 0.78));
      composer.addPass(new OutputPass());

      // ---------- Bild für Zeitpunkt t (rein funktional) ----------
      const _a = new THREE.Vector3(), _b = new THREE.Vector3(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _s = new THREE.Vector3(), _c = new THREE.Vector3();
      const M2 = new THREE.Matrix4();
      const red = new THREE.Color(0xff2a2a), orange = new THREE.Color(0xff8a10);
      function render(t) {
        camAt(t);
        const pa = dustGeo.attributes.position.array;
        dustBase.forEach((d, i) => { pa[i * 3] = d[0] + Math.sin(t * 0.3 + d[4]) * 0.3; pa[i * 3 + 1] = (d[1] + t * d[3]) % 9; pa[i * 3 + 2] = d[2]; });
        dustGeo.attributes.position.needsUpdate = true;

        let look = null, lookW = 0;
        D.forEach((d, di) => {
          const lift = sm(seg(t, d.k - 0.35, d.k)), fly = eio(seg(t, d.k, d.k + FL));
          const start = _a.set(TX, d.y + 0.03 + lift * 0.35, TZ), end = _b.set(d.pos[0], 0.02, d.pos[2]);
          const p = start.clone().lerp(end, fly); p.y += Math.sin(fly * Math.PI) * 2.4;
          d.mesh.position.copy(p); d.mesh.rotation.y = fly * Math.PI;
          const wsc = lerp(TW - 0.06, CW - 0.12, fly); d.mesh.scale.set(wsc, d.h - 0.014, wsc);
          const flash = Math.max(lift * (1 - fly), 0);
          d.mat.emissive.copy(orange).lerp(red, flash); d.mat.emissiveIntensity = 0.16 + flash * 0.9;
          const land = seg(t, d.k + FL - 0.1, d.k + FL + 0.25);
          d.amtLab.visible = t > d.k + FL - 0.1; d.amtLab.scale.copy(d.amtLab.userData.base).multiplyScalar(eout(land) * (1 + Math.sin(land * Math.PI) * 0.35));
          for (let j = 0; j < NC; j++) {
            const o = coinOff[di * NC + j], ci = di * NC + j, f = seg(t, d.k + o[3], d.k + o[3] + FL * 0.95);
            if (f <= 0 || f >= 1) { M2.makeScale(0, 0, 0); coins.setMatrixAt(ci, M2); continue; }
            const e = eio(f), cp = start.clone().lerp(end, e);
            cp.y += Math.sin(e * Math.PI) * (2.4 + o[1]) + 0.4; cp.x += o[0] * Math.sin(e * Math.PI); cp.z += o[2] * Math.sin(e * Math.PI);
            _e.set(t * 6 * o[5] + o[4], t * 4 + o[4], 0); _q.setFromEuler(_e); const sc = Math.sin(f * Math.PI) * 1.1; _s.set(sc, sc, sc);
            M2.compose(cp, _q, _s); coins.setMatrixAt(ci, M2);
          }
          const w = sm(seg(t, d.k - 0.4, d.k)) * (1 - sm(seg(t, d.k + FL + 0.2, d.k + FL + 0.8)));
          if (w > lookW) { lookW = w; look = p; }
        });
        // Dauerstrom „pro Sekunde“ in den Plattform-Käfig
        const s0 = B.code.start, s1 = B.rest.start;
        for (let j = 0; j < NS; j++) {
          const o = coinOff[D.length * NC + j], idx = D.length * NC + j, cyc = 1.1;
          let st = s0 + o[6] * cyc; if (t > st) st += Math.floor((t - st) / cyc) * cyc;
          const f = (t - st) / 0.9;
          if (t < s0 || t > s1 || f < 0 || f >= 1) { M2.makeScale(0, 0, 0); coins.setMatrixAt(idx, M2); continue; }
          _c.set(P.pos[0] + o[0] * 0.5, 0.25 + P.h + 3.2 * (1 - f * f), P.pos[2] + o[2] * 0.5);
          _e.set(t * 5 * o[5] + o[4], t * 3, 0); _q.setFromEuler(_e); _s.setScalar(1);
          M2.compose(_c, _q, _s); coins.setMatrixAt(idx, M2);
        }
        coins.instanceMatrix.needsUpdate = true;

        // Schilder
        priceLab.visible = false;
        const codeA = sm(seg(t, B.code.key - 0.2, B.code.key + 0.2)) * (1 - sm(seg(t, B.rest.start, B.rest.start + 0.3)));
        codeLab.visible = codeA > 0.01; codeLab.material.opacity = codeA; codeLab.scale.copy(codeLab.userData.base).multiplyScalar(0.6 + 0.4 * eout(codeA));
        const wa = eout(seg(t, B.tempo.start, B.tempo.start + 0.4)) * (1 - sm(seg(t, B.rest.start, B.rest.start + 0.3)));
        watch.visible = wa > 0.01; wMat.opacity = wa; hand.material.opacity = wa; perSec.material.opacity = wa;
        watch.position.set(P.pos[0], 5.0, P.pos[2] + 0.2); watch.scale.setScalar(0.5 + 0.5 * wa);
        hand.rotation.z = -(Math.floor(t) + eout(seg(t % 1, 0, 0.12))) * (Math.PI * 2 / 12);
        perSec.scale.copy(perSec.userData.base).multiplyScalar(1 + 0.12 * Math.max(0, 1 - (t % 1) * 4));
        const rr = sm(seg(t, B.rest.key - 0.2, B.rest.key + 0.3)) * (1 - sm(seg(t, B.punch.start, B.punch.start + 0.3)));
        ring.visible = rr > 0.01; ring.material.opacity = rr; const rs = 1 + 0.05 * Math.sin(t * 7); ring.scale.set(rs, rs, rs);
        rockLab.material.opacity = sm(seg(t, B.rest.key - 0.2, B.rest.key + 0.2));
        const ga = sm(seg(t, B.punch.key - 0.2, B.punch.key + 0.3)) * (1 - sm(seg(t, B.cta.start, B.cta.start + 0.4)));
        goneMat.opacity = 0.28 * ga * (0.8 + 0.2 * Math.sin(t * 8)); gone.visible = ga > 0.01;
        goneLab.visible = ga > 0.01; goneLab.material.opacity = ga; goneLab.scale.copy(goneLab.userData.base).multiplyScalar(0.6 + 0.4 * eout(ga));

        // Figur
        hero.userData.body.scale.set(1, 1 + Math.sin(t * 2.2) * 0.02, 1);
        let yaw = -0.3 + Math.sin(t * 0.9) * 0.05;
        if (look && lookW > 0) yaw = lerp(yaw, Math.atan2(look.x - FX, look.z - FZ), lookW);
        hero.rotation.y = yaw;
        const slump = sm(seg(t, B.punch.key - 0.2, B.punch.key + 0.5)) * (1 - sm(seg(t, B.cta.start, B.cta.start + 0.6)));
        hero.rotation.x = slump * 0.15; hero.userData.head.position.y = 1.72 - slump * 0.08;
        hero.userData.pad.rotation.z = Math.sin(t * 9) * 0.05;
        const qa = sm(seg(t, B.hook.key + 0.4, B.hook.key + 0.8)) * (1 - sm(seg(t, B.recap.start + 0.5, B.recap.start + 0.9)));
        qMark.visible = qa > 0.01; qMark.material.opacity = qa; qMark.position.set(FX + 0.4, 2.55 + Math.sin(t * 3) * 0.06, FZ);
        qMark.scale.copy(qMark.userData.base).multiplyScalar(0.5 + 0.5 * eout(qa));

        // CTA
        const ca = eout(seg(t, B.cta.start + 0.1, B.cta.start + 0.8));
        for (const [L, x, d0] of [[digLab, -1.5, 0], [shopLab, 1.5, 0.25]]) {
          const a = eout(seg(t, B.cta.start + d0, B.cta.start + d0 + 0.5));
          L.visible = a > 0.01; L.material.opacity = a; L.position.set(x, 5.2 + Math.sin(t * 2 + x) * 0.08, 0.6); L.scale.copy(L.userData.base).multiplyScalar(0.5 + 0.5 * a);
        }
        bigQ.visible = ca > 0.01; bigQ.material.opacity = ca; bigQ.position.set(0, 5.25 + Math.sin(t * 2.5) * 0.1, 0.6); bigQ.scale.copy(bigQ.userData.base).multiplyScalar(0.4 + 0.6 * ca);

        composer.render();
      }

      // ---------- Bereitschaft ----------
      renderer.compile(scene, camera);
      ready = true; render(lastT); resolveReady();
    </script>
  </body>
</html>
