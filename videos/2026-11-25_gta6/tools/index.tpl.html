<!doctype html>

    <div id="root" data-composition-id="main" data-start="0" data-duration="__D__" data-width="1080" data-height="1920">

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to({ v: 0 }, { v: 1, duration: __D__, ease: "none" }, 0);
      window.__timelines["main"] = tl;
    </script>
    <script type="module">
      import * as THREE from "three";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
      import { Reflector } from "three/addons/objects/Reflector.js";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
      import { LineSegments2 } from "three/addons/lines/LineSegments2.js";
      import { LineSegmentsGeometry } from "three/addons/lines/LineSegmentsGeometry.js";
      import { LineMaterial } from "three/addons/lines/LineMaterial.js";

      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      let resolveReady; window.__hf.buildReady.world = new Promise((r) => (resolveReady = r));
      let ready = false, lastT = 0;
      window.addEventListener("hf-seek", (e) => { lastT = e.detail.time; if (ready) render(lastT); });
      await Promise.all([document.fonts.load("900 64px Montserrat"), document.fonts.load("900 220px Montserrat")]);

      const B = __BEATS__;
      const W = 1080, H = 1920;

      // ---------- Hilfsfunktionen ----------
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const seg = (t, a, b) => clamp((t - a) / (b - a));
      const sm = (x) => x * x * (3 - 2 * x);
      const smr = (x) => x * x * x * (x * (x * 6 - 15) + 10);
      const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const eout = (x) => 1 - Math.pow(1 - x, 3);
      const lerp = (a, b, x) => a + (b - a) * x;
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const rnd = mulberry32(20261124);

      // ---------- Renderer ----------
      const canvas = document.getElementById("world");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.92;
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x030409);
      scene.fog = new THREE.FogExp2(0x030409, 0.022);
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.35;

      const camera = new THREE.PerspectiveCamera(48, W / H, 0.1, 200);

      scene.add(new THREE.HemisphereLight(0x22335a, 0x000000, 0.5));
      const key = new THREE.DirectionalLight(0xffdcaa, 2.2); key.position.set(5, 9, 7); scene.add(key);
      const rim = new THREE.DirectionalLight(0x5f7dff, 1.4); rim.position.set(-6, 5, -7); scene.add(rim);
      const towerLight = new THREE.PointLight(0xffaa33, 2.5, 9, 2); towerLight.position.set(3.2, 2.4, 5.0); scene.add(towerLight);

      // ---------- Materialien ----------
      const GOLD = 0xffc23a;
      const goldMat = () => new THREE.MeshStandardMaterial({ color: GOLD, emissive: 0xff8a10, emissiveIntensity: 0.16, metalness: 0.75, roughness: 0.34 });
      const lineMat = (color, width, opacity) => {
        const m = new LineMaterial({ color, linewidth: width, transparent: true, opacity, worldUnits: false });
        m.resolution.set(W, H); return m;
      };

      // Gitter-Käfig (wie Referenz): Kanten, Ringe alle `step`, senkrechte Teilungen je Seite
      function cagePositions(w, h, d, step = 0.5, div = 3) {
        const p = [], x0 = -w / 2, x1 = w / 2, z0 = -d / 2, z1 = d / 2;
        const L = (a, b) => p.push(...a, ...b);
        const rings = Math.max(1, Math.round(h / step));
        for (let i = 0; i <= rings; i++) { const y = (h * i) / rings; L([x0, y, z0], [x1, y, z0]); L([x1, y, z0], [x1, y, z1]); L([x1, y, z1], [x0, y, z1]); L([x0, y, z1], [x0, y, z0]); }
        for (let i = 0; i <= div; i++) {
          const fx = lerp(x0, x1, i / div), fz = lerp(z0, z1, i / div);
          L([fx, 0, z0], [fx, h, z0]); L([fx, 0, z1], [fx, h, z1]); L([x0, 0, fz], [x0, h, fz]); L([x1, 0, fz], [x1, h, fz]);
        }
        return p;
      }
      function cage(w, h, d, color, width, opacity, step, div) {
        const g = new LineSegmentsGeometry(); g.setPositions(cagePositions(w, h, d, step, div));
        return new LineSegments2(g, lineMat(color, width, opacity));
      }

      // Text-Schild als Sprite (Badge wie „FIRMA 1“ in der Referenz)
      function label(text, { color = "#ffd23f", border = color, size = 64, worldH = 0.42, bg = "rgba(5,6,10,0.82)", weight = 900, pad = 0.42 } = {}) {
        const c = document.createElement("canvas"), x = c.getContext("2d");
        const font = `${weight} ${size}px Montserrat`;
        x.font = font; const tw = Math.ceil(x.measureText(text).width);
        const ph = Math.round(size * pad), cw = tw + ph * 2 + 8, ch = Math.round(size * 1.5);
        c.width = cw; c.height = ch;
        x.font = font; x.textBaseline = "middle"; x.textAlign = "center";
        const r = ch * 0.22;
        x.beginPath(); x.roundRect(4, 4, cw - 8, ch - 8, r); x.fillStyle = bg; x.fill();
        x.lineWidth = 6; x.strokeStyle = border; x.stroke();
        x.fillStyle = color; x.shadowColor = color; x.shadowBlur = 18; x.fillText(text, cw / 2, ch / 2 + size * 0.04);
        const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
        const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, fog: false }));
        s.scale.set((worldH * cw) / ch, worldH, 1); s.userData.base = s.scale.clone();
        return s;
      }
      function glyph(text, color, worldH) {
        const c = document.createElement("canvas"), x = c.getContext("2d"); c.width = 256; c.height = 256;
        x.font = "900 220px Montserrat"; x.textAlign = "center"; x.textBaseline = "middle";
        x.fillStyle = color; x.shadowColor = color; x.shadowBlur = 30; x.fillText(text, 128, 140);
        const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
        const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, fog: false }));
        s.scale.set(worldH, worldH, 1); s.userData.base = s.scale.clone(); return s;
      }

      // ---------- Boden: Spiegelung + Goldraster ----------
      const mirror = new Reflector(new THREE.PlaneGeometry(140, 140), { textureWidth: 540, textureHeight: 960, color: 0x8a8a8a, clipBias: 0.003 });
      mirror.rotation.x = -Math.PI / 2; scene.add(mirror);
      const dim = new THREE.Mesh(new THREE.PlaneGeometry(140, 140), new THREE.MeshBasicMaterial({ color: 0x030409, transparent: true, opacity: 0.74 }));
      dim.rotation.x = -Math.PI / 2; dim.position.y = 0.004; scene.add(dim);
      const grid = new THREE.GridHelper(80, 80, 0x5a4214, 0x2a1f0a); grid.position.y = 0.008;
      grid.material.transparent = true; grid.material.opacity = 0.32; scene.add(grid);

      // ---------- Skyline im Hintergrund ----------
      const sky = new THREE.Group(); scene.add(sky);
      const bMat = new THREE.MeshStandardMaterial({ color: 0x07080d, roughness: 0.8, metalness: 0.2 });
      const winGeo = new THREE.PlaneGeometry(0.13, 0.17);
      const winMat = new THREE.MeshBasicMaterial({ color: 0x9a6a22, fog: false });
      const winList = [];
      for (let i = 0; i < 34; i++) {
        const w = 1.0 + rnd() * 1.6, d = 1.0 + rnd() * 1.2;
        const cx = -24 + i * 1.45 + (rnd() - 0.5) * 0.6;
        const center = 1 - Math.min(1, Math.abs(cx) / 24);
        const h = 2.5 + rnd() * 6 + center * 6;
        const z = -44 - rnd() * 8;
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), bMat); m.position.set(cx, h / 2, z); sky.add(m);
        const e = cage(w, h, d, 0x9a7426, 1.4, 0.45, 100, 1); e.position.set(cx, 0, z); sky.add(e);
        for (let fy = 0.6; fy < h - 0.4; fy += 0.5) for (let fx = -w / 2 + 0.3; fx < w / 2 - 0.2; fx += 0.34)
          if (rnd() < 0.2) winList.push([cx + fx, fy, z + d / 2 + 0.01]);
      }
      // Wahrzeichen: generischer Fernsehturm
      const spire = new THREE.Group(); spire.position.set(6, 0, -52); sky.add(spire);
      const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.7, 18, 12), bMat); shaft.position.y = 9; spire.add(shaft);
      const pod = new THREE.Mesh(new THREE.SphereGeometry(1.4, 24, 16), bMat); pod.position.y = 15; spire.add(pod);
      const podRing = new THREE.Mesh(new THREE.TorusGeometry(1.42, 0.05, 8, 48), new THREE.MeshBasicMaterial({ color: 0xffc85a, fog: false })); podRing.rotation.x = Math.PI / 2; podRing.position.y = 15; spire.add(podRing);
      const tip = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff4040, fog: false })); tip.position.y = 21.5; spire.add(tip);
      const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.12, 3.5, 6), bMat); antenna.position.y = 19.8; spire.add(antenna);
      const wins = new THREE.InstancedMesh(winGeo, winMat, winList.length);
      const tmpM = new THREE.Matrix4();
      winList.forEach((p, i) => { tmpM.makeTranslation(p[0], p[1], p[2]); wins.setMatrixAt(i, tmpM); });
      sky.add(wins);

      // ---------- Schwebender Goldstaub ----------
      const NDust = 420, dustBase = [];
      for (let i = 0; i < NDust; i++) dustBase.push([(rnd() - 0.5) * 26, rnd() * 9, -14 + rnd() * 22, 0.04 + rnd() * 0.12, rnd() * 6.28]);
      const dustGeo = new THREE.BufferGeometry(); dustGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(NDust * 3), 3));
      const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0xffcf66, size: 0.05, transparent: true, opacity: 0.75, depthWrite: false }));
      scene.add(dust);

      // ---------- Daten ----------
      const U = 1 / 500e6; // 1 Höheneinheit = 500 Mio. $
      const H6 = 3.79e9 * U, H5 = 0.8e9 * U, HE = 1.2e9 * U;
      const boxGeo = new THREE.BoxGeometry(1, 1, 1); boxGeo.translate(0, 0.5, 0);
      const TW = 1.3;
      function tower(x, name, color, mat) {
        const g = new THREE.Group(); g.position.set(x, 0, 0); scene.add(g);
        const fill = new THREE.Mesh(boxGeo, mat); fill.scale.set(TW - 0.06, 0.001, TW - 0.06); g.add(fill);
        const lab = label(name, { color, border: color, worldH: 0.3 }); lab.position.set(0, 0.4, TW / 2 + 0.3); g.add(lab);
        return { g, fill, lab, cage: null };
      }
      const silverMat = new THREE.MeshStandardMaterial({ color: 0xc8d0e0, emissive: 0x506080, emissiveIntensity: 0.18, metalness: 0.85, roughness: 0.3 });
      const T6 = tower(0, "GTA 6 · TAG 1", "#ffd23f", goldMat());
      const T5 = tower(-2.4, "GTA 5 · 2013", "#ffa640", goldMat());
      const TE = tower(2.4, "KINO-REKORD", "#c8d0ff", silverMat);
      T6.cage = cage(TW + 0.12, 8.0, TW + 0.12, 0xffc23a, 2.6, 0.95, 0.5, 4); T6.g.add(T6.cage);
      T5.cage = cage(TW + 0.12, H5, TW + 0.12, 0xffa640, 2.2, 0.9, 0.4, 3); T5.g.add(T5.cage);
      TE.cage = cage(TW + 0.12, HE, TW + 0.12, 0xaab8ff, 2.2, 0.9, 0.4, 3); TE.g.add(TE.cage);
      // 3× Endgame-Stapel (Geister-Kopien)
      const ghostMat = new THREE.MeshStandardMaterial({ color: 0xc8d0e0, emissive: 0x6070a0, emissiveIntensity: 0.25, transparent: true, opacity: 0.45, metalness: 0.6, roughness: 0.35, depthWrite: false });
      const ghosts = [1, 2].map(() => { const m = new THREE.Mesh(boxGeo, ghostMat); m.scale.set(TW - 0.06, HE - 0.02, TW - 0.06); TE.g.add(m); return m; });
      const x3 = glyph("×3", "#ffd23f", 1.2); scene.add(x3);
      const rec = label("WELTREKORD", { color: "#ffd23f", border: "#ffd23f", worldH: 0.32 }); rec.position.set(0, H5 + 0.45, 0); T5.g.add(rec);
      // Münzen (Explosion beim Hook + Regen)
      const NC = 70;
      const coinGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.03, 20); coinGeo.rotateX(Math.PI / 2);
      const coins = new THREE.InstancedMesh(coinGeo, new THREE.MeshStandardMaterial({ color: 0xffcc44, emissive: 0xff9a1a, emissiveIntensity: 0.5, metalness: 0.8, roughness: 0.3 }), NC);
      scene.add(coins);
      const coinOff = []; for (let i = 0; i < NC; i++) coinOff.push([rnd() * 6.28, 1.2 + rnd() * 2.6, 2 + rnd() * 3.5, rnd() * 6.28, 0.6 + rnd() * 0.9, rnd()]);
      // Stoppuhr
      const watch = new THREE.Group(); watch.position.set(1.95, 3.0, 1.1); scene.add(watch);
      const wMat = new THREE.MeshBasicMaterial({ color: 0xffd23f, transparent: true });
      watch.add(new THREE.Mesh(new THREE.TorusGeometry(0.75, 0.06, 16, 80), wMat));
      const crown = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.22, 0.08), wMat); crown.position.y = 0.92; watch.add(crown);
      for (let i = 0; i < 12; i++) { const m = new THREE.Mesh(new THREE.BoxGeometry(0.04, i % 3 ? 0.1 : 0.18, 0.03), wMat); const a = i / 12 * Math.PI * 2; m.position.set(Math.sin(a) * 0.6, Math.cos(a) * 0.6, 0); m.rotation.z = -a; watch.add(m); }
      const hand = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.56, 0.04), new THREE.MeshBasicMaterial({ color: 0xff4040, transparent: true })); hand.geometry.translate(0, 0.26, 0); watch.add(hand);
      const perSec = label("+43.866 $ / Sek.", { worldH: 0.26 }); perSec.position.set(0, -1.05, 0); watch.add(perSec);
      // Figur mit Gamepad
      function figure(bodyColor, accent) {
        const g = new THREE.Group();
        const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.42, 0.75, 8, 24), new THREE.MeshPhysicalMaterial({ color: bodyColor, metalness: 0.2, roughness: 0.25, clearcoat: 1, clearcoatRoughness: 0.15 }));
        body.position.y = 0.82; g.add(body);
        const head = new THREE.Group(); head.position.y = 1.72; g.add(head);
        head.add(new THREE.Mesh(new THREE.SphereGeometry(0.36, 32, 24), new THREE.MeshPhysicalMaterial({ color: 0xc9cbd2, roughness: 0.32, clearcoat: 1 })));
        const pad = new THREE.Group(); pad.position.set(0, 0.95, 0.5); g.add(pad);
        const pm = new THREE.MeshPhysicalMaterial({ color: 0x111318, roughness: 0.35, clearcoat: 1 });
        const core = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.18, 0.14), pm); pad.add(core);
        for (const sx of [-1, 1]) { const gr = new THREE.Mesh(new THREE.CapsuleGeometry(0.08, 0.14, 6, 12), pm); gr.position.set(sx * 0.24, -0.1, 0); gr.rotation.z = sx * 0.5; pad.add(gr); }
        for (const [bx, by, c] of [[0.13, 0.03, 0xffd23f], [0.18, -0.02, 0xff4040], [-0.15, 0.0, 0x5f7dff]]) { const b = new THREE.Mesh(new THREE.SphereGeometry(0.03, 10, 8), new THREE.MeshBasicMaterial({ color: c })); b.position.set(bx, by, 0.075); pad.add(b); }
        g.userData = { body, head, pad }; return g;
      }
      const hero = figure(0x1b2a6b, 0xffd23f); hero.position.set(1.5, 0, 2.3); scene.add(hero);
      // Vorbesteller-Menge (1 Figur ≈ 100.000 Käufer → 325)
      const NCR = 325;
      const crowdGeo = new THREE.CapsuleGeometry(0.07, 0.12, 4, 8); crowdGeo.translate(0, 0.14, 0);
      const crowd = new THREE.InstancedMesh(crowdGeo, new THREE.MeshStandardMaterial({ color: 0x2a3f9a, emissive: 0x101a50, emissiveIntensity: 0.4, metalness: 0.3, roughness: 0.4 }), NCR);
      scene.add(crowd);
      const crowdHead = new THREE.InstancedMesh(new THREE.SphereGeometry(0.06, 10, 8), new THREE.MeshStandardMaterial({ color: 0xd8d8d8, roughness: 0.4 }), NCR); scene.add(crowdHead);
      const crowdData = []; for (let i = 0; i < NCR; i++) { const a = -Math.PI * 0.95 + rnd() * Math.PI * 0.9; const r = 3.2 + rnd() * 5.5; crowdData.push([Math.cos(a) * r, Math.sin(a) * r * 0.9 - 1.2, rnd() * 0.9, 10 + rnd() * 8]); }
      const crowdLab = label("32,5 MIO. VORBESTELLUNGEN", { worldH: 0.34 }); crowdLab.position.set(0, 0.6, -5.5); scene.add(crowdLab);
      const bigQ = glyph("?", "#ffd23f", 2.6); bigQ.position.set(0, 9.5, -2); scene.add(bigQ);

      // ---------- Kamera ----------
      const K = [];
      const k = (t, p, tg) => K.push({ t, p: new THREE.Vector3(...p), g: new THREE.Vector3(...tg) });
      k(0.0, [1.8, 1.3, 7.8], [0.2, 2.6, 0]);
      k(B.hook.key, [1.8, 1.4, 7.6], [0.2, 2.8, 0]);
      k(B.hook.key + 1.7, [1.9, 3.4, 12.5], [0.2, 5.2, 0]);
      k(B.sekunde.start + 0.2, [2.2, 3.4, 9.5], [1.4, 3.4, 0.6]);
      k(B.sekunde.end, [2.6, 3.0, 7.2], [1.7, 2.7, 0.9]);
      k(B.live.key, [1.8, 2.0, 8.5], [0.6, 4.8, 0]);
      k(B.live.end, [1.6, 2.2, 9.0], [0.5, 5.2, 0]);
      k(B.gta5.key, [-1.2, 2.6, 8.4], [-1.9, 2.2, 0]);
      k(B.rekord.end, [-1.6, 2.6, 7.6], [-2.2, 2.0, 0]);
      k(B.twist.end, [0, 4.6, 15.5], [0, 4.0, 0]);
      k(B.endgame.key + 0.3, [2.0, 2.8, 8.6], [2.3, 2.1, 0]);
      k(B.endgame.end, [2.2, 3.0, 9.0], [2.3, 2.3, 0]);
      k(B.dreifach.key + 0.2, [1.3, 4.8, 14.0], [1.2, 4.4, 0]);
      k(B.dreifach.end, [1.2, 5.0, 14.6], [1.2, 4.6, 0]);
      k(B.grund.key, [0, 6.8, 13.0], [0, 1.6, -3.0]);
      k(B.grund.end, [0, 7.2, 13.6], [0, 1.8, -3.0]);
      k(B.punch.key, [1.3, 3.8, 11.5], [0.5, 4.2, 0]);
      k(B.punch.end, [1.2, 4.0, 12.0], [0.4, 4.4, 0]);
      k(B.T, [0, 9.0, 14.5], [0, 8.4, -2]);
      K.sort((a, b) => a.t - b.t);
      const _p = new THREE.Vector3(), _g = new THREE.Vector3();
      function camAt(t) {
        if (t <= K[0].t) { _p.copy(K[0].p); _g.copy(K[0].g); }
        else if (t >= K[K.length - 1].t) { _p.copy(K[K.length - 1].p); _g.copy(K[K.length - 1].g); }
        else for (let i = 0; i < K.length - 1; i++) if (t >= K[i].t && t <= K[i + 1].t) {
          const x = smr(seg(t, K[i].t, K[i + 1].t)); _p.lerpVectors(K[i].p, K[i + 1].p, x); _g.lerpVectors(K[i].g, K[i + 1].g, x); break;
        }
        // leichtes Handkamera-Schweben
        _p.x += Math.sin(t * 0.7) * 0.05; _p.y += Math.sin(t * 0.53 + 1) * 0.04;
        camera.position.copy(_p); camera.lookAt(_g);
      }

      // ---------- Post-Processing ----------
      const composer = new EffectComposer(renderer);
      composer.setPixelRatio(1); composer.setSize(W, H);
      composer.addPass(new RenderPass(scene, camera));
      composer.addPass(new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.55, 0.5, 0.78));
      composer.addPass(new OutputPass());

      // ---------- Bild für Zeitpunkt t (rein funktional) ----------
      const _q = new THREE.Quaternion(), _e = new THREE.Euler(), _s = new THREE.Vector3(), _c = new THREE.Vector3();
      const M2 = new THREE.Matrix4();
      const grow = (T, h, k0, dur) => { const x = eout(seg(t0, k0, k0 + dur)); T.fill.scale.y = Math.max(0.001, h * x); T.fill.visible = x > 0; return x; };
      let t0 = 0;
      function render(t) {
        t0 = t; camAt(t);
        const pa = dustGeo.attributes.position.array;
        dustBase.forEach((d, i) => { pa[i * 3] = d[0] + Math.sin(t * 0.3 + d[4]) * 0.3; pa[i * 3 + 1] = (d[1] + t * d[3]) % 9; pa[i * 3 + 2] = d[2]; });
        dustGeo.attributes.position.needsUpdate = true;

        // Türme
        const g6 = grow(T6, H6, B.hook.key, 1.6);
        const g5 = grow(T5, H5, B.gta5.key, 0.8);
        const gE = grow(TE, HE, B.endgame.key, 0.8);
        T5.g.visible = t > B.gta5.start - 0.3; TE.g.visible = t > B.endgame.start - 0.3;
        T5.cage.material.opacity = 0.9 * sm(seg(t, B.gta5.start - 0.3, B.gta5.start));
        TE.cage.material.opacity = 0.9 * sm(seg(t, B.endgame.start - 0.3, B.endgame.start));
        T6.fill.material.emissiveIntensity = 0.16 + (t > B.punch.key ? 0.1 + 0.08 * Math.sin(t * 8) : 0);
        const recA = sm(seg(t, B.rekord.key - 0.1, B.rekord.key + 0.3)) * (1 - sm(seg(t, B.twist.start, B.twist.start + 0.4)));
        rec.visible = false; rec.material.opacity = recA; rec.scale.copy(rec.userData.base).multiplyScalar(0.6 + 0.4 * eout(recA));
        // 3× stapeln
        ghosts.forEach((m, i) => {
          const k0 = B.dreifach.key - 0.3 + i * 0.35; const x = eout(seg(t, k0, k0 + 0.45));
          m.visible = x > 0; m.position.y = HE * (i + 1) + (1 - x) * 3;
          ghostMat.opacity = 0.45 * (1 - sm(seg(t, B.cta.start, B.cta.start + 0.6)));
        });
        const xa = eout(seg(t, B.dreifach.key + 0.5, B.dreifach.key + 0.9)) * (1 - sm(seg(t, B.grund.start, B.grund.start + 0.4)));
        x3.visible = xa > 0.01; x3.material.opacity = xa; x3.position.set(1.2, HE * 3 + 0.9, 0.3); x3.scale.copy(x3.userData.base).multiplyScalar(0.5 + 0.5 * xa);

        // Münz-Explosion beim Hook, danach Regen auf GTA-6-Turm
        for (let i = 0; i < NC; i++) {
          const o = coinOff[i];
          let p = null;
          const f = seg(t, B.hook.key + 0.1, B.hook.key + 2.2);
          if (f > 0 && f < 1) {
            const tt = f * 2.1; p = _c.set(Math.cos(o[0]) * o[1] * tt * 0.9, H6 * g6 + o[2] * tt - 4.9 * tt * tt * 0.55, Math.sin(o[0]) * o[1] * tt * 0.5 + 0.4);
            if (p.y < 0.05) p = null;
          } else if (t > B.sekunde.key && t < B.live.end) {
            const cyc = 0.9, s0 = B.sekunde.key + o[5] * cyc, ph = ((t - s0) % cyc + cyc) % cyc / cyc;
            if (t > s0) p = _c.set((o[5] - 0.5) * 1.0, H6 + 2.4 * (1 - ph * ph), (Math.sin(o[0]) - 0) * 0.4);
          }
          if (!p) { M2.makeScale(0, 0, 0); coins.setMatrixAt(i, M2); continue; }
          _e.set(t * 5 * o[4] + o[3], t * 3 + o[3], 0); _q.setFromEuler(_e); _s.setScalar(1);
          M2.compose(p, _q, _s); coins.setMatrixAt(i, M2);
        }
        coins.instanceMatrix.needsUpdate = true;

        // Stoppuhr: tickt jede Sekunde
        const wa = eout(seg(t, B.sekunde.start, B.sekunde.start + 0.4)) * (1 - sm(seg(t, B.gta5.start - 0.2, B.gta5.start + 0.2)))
                 + eout(seg(t, B.punch.start, B.punch.start + 0.4)) * (1 - sm(seg(t, B.cta.start, B.cta.start + 0.4)));
        watch.visible = wa > 0.01; wMat.opacity = Math.min(1, wa); hand.material.opacity = Math.min(1, wa); perSec.material.opacity = Math.min(1, wa);
        watch.scale.setScalar(0.5 + 0.5 * Math.min(1, wa));
        const tick = Math.floor(t) + eout(seg(t % 1, 0, 0.12));
        hand.rotation.z = -tick * (Math.PI * 2 / 12);
        watch.position.set(t > B.punch.start - 0.5 ? 2.1 : 2.0, t > B.punch.start - 0.5 ? 5.7 : 4.1, 1.1);
        perSec.scale.copy(perSec.userData.base).multiplyScalar(1 + 0.12 * Math.max(0, 1 - (t % 1) * 4));

        // Menge der Vorbesteller läuft zum Turm
        const ca = seg(t, B.grund.start - 0.2, B.grund.start + 0.6);
        crowd.visible = crowdHead.visible = ca > 0 && t < B.punch.end + 0.5;
        if (crowd.visible) crowdData.forEach((d, i) => {
          const app = eout(seg(t, B.grund.start - 0.2 + d[2] * 0.6, B.grund.start + 0.3 + d[2] * 0.6));
          const walk = Math.min(0.55, (t - B.grund.start) * 0.12);
          const x = d[0] * (1 - walk * 0.6), z = d[1] * (1 - walk * 0.6), bob = Math.abs(Math.sin(t * d[3] + i)) * 0.04;
          M2.compose(_c.set(x, bob - (1 - app) * 0.6, z), _q.identity(), _s.setScalar(app)); crowd.setMatrixAt(i, M2);
          M2.compose(_c.set(x, bob + 0.36 * app - (1 - app) * 0.6, z), _q.identity(), _s.setScalar(app)); crowdHead.setMatrixAt(i, M2);
        });
        crowd.instanceMatrix.needsUpdate = true; crowdHead.instanceMatrix.needsUpdate = true;
        const cl = sm(seg(t, B.grund.key - 0.1, B.grund.key + 0.3)) * (1 - sm(seg(t, B.punch.start, B.punch.start + 0.3)));
        crowdLab.visible = cl > 0.01; crowdLab.material.opacity = cl;

        // Figur: zockt, schaut hoch zum Turm, staunt
        hero.userData.body.scale.set(1, 1 + Math.sin(t * 2.2) * 0.02, 1);
        const lookUp = sm(seg(t, B.hook.key + 0.2, B.hook.key + 0.8)) * (1 - sm(seg(t, B.sekunde.start, B.sekunde.start + 0.5)))
                     + sm(seg(t, B.live.key - 0.2, B.live.key + 0.3)) * (1 - sm(seg(t, B.live.end, B.live.end + 0.5)));
        hero.userData.head.rotation.x = -0.55 * Math.min(1, lookUp);
        hero.rotation.y = lerp(-0.25 + Math.sin(t * 0.8) * 0.06, Math.atan2(0 - hero.position.x, 0 - hero.position.z), Math.min(1, lookUp) * 0.8);
        hero.userData.pad.rotation.z = Math.sin(t * 9) * 0.05; hero.userData.pad.position.y = 0.95 + Math.abs(Math.sin(t * 6)) * 0.02;
        const jump = t > B.dreifach.key ? Math.abs(Math.sin((t - B.dreifach.key) * 7)) * 0.22 * (1 - seg(t, B.dreifach.key + 1.4, B.dreifach.key + 1.8)) : 0;
        hero.position.y = jump;

        // Teil 2
        const bq = eout(seg(t, B.cta.start + 0.4, B.cta.start + 1.4));
        bigQ.visible = bq > 0; bigQ.material.opacity = bq;
        bigQ.position.y = 9.2 + bq * 0.6 + Math.sin(t * 2.5) * 0.12;
        bigQ.scale.copy(bigQ.userData.base).multiplyScalar(0.4 + 0.6 * bq);

        composer.render();
      }

      // ---------- Bereitschaft ----------
      renderer.compile(scene, camera);
      ready = true; render(lastT); resolveReady();
    </script>
  </body>
</html>
