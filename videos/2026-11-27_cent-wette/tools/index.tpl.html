    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to({ v: 0 }, { v: 1, duration: __D__, ease: "none" }, 0);

    </script>
    <script type="module">
      import * as THREE from "three";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
      import { Reflector } from "three/addons/objects/Reflector.js";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
      import { LineSegments2 } from "three/addons/lines/LineSegments2.js";
      import { LineSegmentsGeometry } from "three/addons/lines/LineSegmentsGeometry.js";
      import { LineMaterial } from "three/addons/lines/LineMaterial.js";

      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      let resolveReady; window.__hf.buildReady.world = new Promise((r) => (resolveReady = r));
      let ready = false, lastT = 0;
      window.addEventListener("hf-seek", (e) => { lastT = e.detail.time; if (ready) render(lastT); });
      await Promise.all([document.fonts.load("900 64px Montserrat"), document.fonts.load("900 220px Montserrat")]);

      const B = __BEATS__;
      const W = 1080, H = 1920;

      // ---------- Hilfsfunktionen ----------
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const seg = (t, a, b) => clamp((t - a) / (b - a));
      const sm = (x) => x * x * (3 - 2 * x);
      const smr = (x) => x * x * x * (x * (x * 6 - 15) + 10);
      const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const eout = (x) => 1 - Math.pow(1 - x, 3);
      const lerp = (a, b, x) => a + (b - a) * x;
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const rnd = mulberry32(20261124);

      // ---------- Renderer ----------
      const canvas = document.getElementById("world");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.92;
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x030409);
      scene.fog = new THREE.FogExp2(0x030409, 0.022);
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.35;

      const camera = new THREE.PerspectiveCamera(44, W / H, 0.1, 200);

      scene.add(new THREE.HemisphereLight(0x22335a, 0x000000, 0.5));
      const key = new THREE.DirectionalLight(0xffdcaa, 2.2); key.position.set(5, 9, 7); scene.add(key);
      const rim = new THREE.DirectionalLight(0x5f7dff, 1.4); rim.position.set(-6, 5, -7); scene.add(rim);
      const towerLight = new THREE.PointLight(0xffaa33, 2.5, 9, 2); towerLight.position.set(3.2, 2.4, 5.0); scene.add(towerLight);

      // ---------- Materialien ----------
      const GOLD = 0xffc23a;
      const goldMat = () => new THREE.MeshStandardMaterial({ color: GOLD, emissive: 0xff8a10, emissiveIntensity: 0.16, metalness: 0.75, roughness: 0.34 });
      const lineMat = (color, width, opacity) => {
        const m = new LineMaterial({ color, linewidth: width, transparent: true, opacity, worldUnits: false });
        m.resolution.set(W, H); return m;
      };

      // Gitter-Käfig (wie Referenz): Kanten, Ringe alle `step`, senkrechte Teilungen je Seite
      function cagePositions(w, h, d, step = 0.5, div = 3) {
        const p = [], x0 = -w / 2, x1 = w / 2, z0 = -d / 2, z1 = d / 2;
        const L = (a, b) => p.push(...a, ...b);
        const rings = Math.max(1, Math.round(h / step));
        for (let i = 0; i <= rings; i++) { const y = (h * i) / rings; L([x0, y, z0], [x1, y, z0]); L([x1, y, z0], [x1, y, z1]); L([x1, y, z1], [x0, y, z1]); L([x0, y, z1], [x0, y, z0]); }
        for (let i = 0; i <= div; i++) {
          const fx = lerp(x0, x1, i / div), fz = lerp(z0, z1, i / div);
          L([fx, 0, z0], [fx, h, z0]); L([fx, 0, z1], [fx, h, z1]); L([x0, 0, fz], [x0, h, fz]); L([x1, 0, fz], [x1, h, fz]);
        }
        return p;
      }
      function cage(w, h, d, color, width, opacity, step, div) {
        const g = new LineSegmentsGeometry(); g.setPositions(cagePositions(w, h, d, step, div));
        return new LineSegments2(g, lineMat(color, width, opacity));
      }

      // Text-Schild als Sprite (Badge wie „FIRMA 1“ in der Referenz)
      function label(text, { color = "#ffd23f", border = color, size = 64, worldH = 0.42, bg = "rgba(5,6,10,0.82)", weight = 900, pad = 0.42 } = {}) {
        const c = document.createElement("canvas"), x = c.getContext("2d");
        const font = `${weight} ${size}px Montserrat`;
        x.font = font; const tw = Math.ceil(x.measureText(text).width);
        const ph = Math.round(size * pad), cw = tw + ph * 2 + 8, ch = Math.round(size * 1.5);
        c.width = cw; c.height = ch;
        x.font = font; x.textBaseline = "middle"; x.textAlign = "center";
        const r = ch * 0.22;
        x.beginPath(); x.roundRect(4, 4, cw - 8, ch - 8, r); x.fillStyle = bg; x.fill();
        x.lineWidth = 6; x.strokeStyle = border; x.stroke();
        x.fillStyle = color; x.shadowColor = color; x.shadowBlur = 18; x.fillText(text, cw / 2, ch / 2 + size * 0.04);
        const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
        const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, fog: false }));
        s.scale.set((worldH * cw) / ch, worldH, 1); s.userData.base = s.scale.clone();
        return s;
      }
      function glyph(text, color, worldH) {
        const c = document.createElement("canvas"), x = c.getContext("2d"); c.width = 256; c.height = 256;
        x.font = "900 220px Montserrat"; x.textAlign = "center"; x.textBaseline = "middle";
        x.fillStyle = color; x.shadowColor = color; x.shadowBlur = 30; x.fillText(text, 128, 140);
        const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
        const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, fog: false }));
        s.scale.set(worldH, worldH, 1); s.userData.base = s.scale.clone(); return s;
      }

      // ---------- Boden: Spiegelung + Goldraster ----------
      const mirror = new Reflector(new THREE.PlaneGeometry(140, 140), { textureWidth: 540, textureHeight: 960, color: 0x8a8a8a, clipBias: 0.003 });
      mirror.rotation.x = -Math.PI / 2; scene.add(mirror);
      const dim = new THREE.Mesh(new THREE.PlaneGeometry(140, 140), new THREE.MeshBasicMaterial({ color: 0x030409, transparent: true, opacity: 0.74 }));
      dim.rotation.x = -Math.PI / 2; dim.position.y = 0.004; scene.add(dim);
      const grid = new THREE.GridHelper(80, 80, 0x5a4214, 0x2a1f0a); grid.position.y = 0.008;
      grid.material.transparent = true; grid.material.opacity = 0.32; scene.add(grid);

      // ---------- Skyline im Hintergrund ----------
      const sky = new THREE.Group(); scene.add(sky);
      const bMat = new THREE.MeshStandardMaterial({ color: 0x07080d, roughness: 0.8, metalness: 0.2 });
      const winGeo = new THREE.PlaneGeometry(0.13, 0.17);
      const winMat = new THREE.MeshBasicMaterial({ color: 0x9a6a22, fog: false });
      const winList = [];
      for (let i = 0; i < 34; i++) {
        const w = 1.0 + rnd() * 1.6, d = 1.0 + rnd() * 1.2;
        const cx = -24 + i * 1.45 + (rnd() - 0.5) * 0.6;
        const center = 1 - Math.min(1, Math.abs(cx) / 24);
        const h = 2.5 + rnd() * 6 + center * 6;
        const z = -44 - rnd() * 8;
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), bMat); m.position.set(cx, h / 2, z); sky.add(m);
        const e = cage(w, h, d, 0x9a7426, 1.4, 0.45, 100, 1); e.position.set(cx, 0, z); sky.add(e);
        for (let fy = 0.6; fy < h - 0.4; fy += 0.5) for (let fx = -w / 2 + 0.3; fx < w / 2 - 0.2; fx += 0.34)
          if (rnd() < 0.2) winList.push([cx + fx, fy, z + d / 2 + 0.01]);
      }
      // Wahrzeichen: generischer Fernsehturm
      const spire = new THREE.Group(); spire.position.set(6, 0, -52); sky.add(spire);
      const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.7, 18, 12), bMat); shaft.position.y = 9; spire.add(shaft);
      const pod = new THREE.Mesh(new THREE.SphereGeometry(1.4, 24, 16), bMat); pod.position.y = 15; spire.add(pod);
      const podRing = new THREE.Mesh(new THREE.TorusGeometry(1.42, 0.05, 8, 48), new THREE.MeshBasicMaterial({ color: 0xffc85a, fog: false })); podRing.rotation.x = Math.PI / 2; podRing.position.y = 15; spire.add(podRing);
      const tip = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff4040, fog: false })); tip.position.y = 21.5; spire.add(tip);
      const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.12, 3.5, 6), bMat); antenna.position.y = 19.8; spire.add(antenna);
      const wins = new THREE.InstancedMesh(winGeo, winMat, winList.length);
      const tmpM = new THREE.Matrix4();
      winList.forEach((p, i) => { tmpM.makeTranslation(p[0], p[1], p[2]); wins.setMatrixAt(i, tmpM); });
      sky.add(wins);

      // ---------- Schwebender Goldstaub ----------
      const NDust = 420, dustBase = [];
      for (let i = 0; i < NDust; i++) dustBase.push([(rnd() - 0.5) * 26, rnd() * 9, -14 + rnd() * 22, 0.04 + rnd() * 0.12, rnd() * 6.28]);
      const dustGeo = new THREE.BufferGeometry(); dustGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(NDust * 3), 3));
      const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0xffcf66, size: 0.05, transparent: true, opacity: 0.75, depthWrite: false }));
      scene.add(dust);

      // ---------- Cent-Wette: Million (links) vs. Cent-Turm (rechts), maßstabsgetreu ----------
      const H1M = 3.0;                         // 1 Mio. € = 3 Einheiten
      const PX = -2.3, CXX = 2.1, PED = 0.9;   // Goldbarren-Haufen, Cent-Podest, Podesthöhe
      const val = (d) => 0.01 * Math.pow(2, d - 1);
      function dayAt(t) {
        const segs = [[B.tag10.start, 1], [B.tag10.key, 10], [B.tag20.start, 10], [B.tag20.key, 20], [B.tag27.start, 20], [B.tag27.key, 27], [B.tag28.start, 27], [B.tag28.key, 28], [B.tag30.start, 28], [B.tag30.key + 0.9, 30]];
        if (t <= segs[0][0]) return 1;
        for (let i = 0; i < segs.length - 1; i++) if (t < segs[i + 1][0]) return lerp(segs[i][1], segs[i + 1][1], eio(seg(t, segs[i][0], segs[i + 1][0])));
        return 30;
      }
      const boxGeo = new THREE.BoxGeometry(1, 1, 1); boxGeo.translate(0, 0.5, 0);
      // Goldbarren-Haufen (1 Mio.)
      const barGeo = new THREE.BoxGeometry(0.62, 0.2, 0.3);
      const bars = new THREE.InstancedMesh(barGeo, goldMat(), 70); bars.frustumCulled = false; scene.add(bars);
      { let i = 0; const M = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(1, 1, 1);
        for (let lay = 0; lay < 7 && i < 70; lay++) for (let r = 0; r < 7 - lay && i < 70; r++) for (let c = 0; c < 2 && i < 70; c++) {
          q.setFromEuler(new THREE.Euler(0, (rnd() - 0.5) * 0.1, 0));
          M.compose(new THREE.Vector3(PX + (r - (6 - lay) / 2) * 0.64, 0.1 + lay * 0.21, (c - 0.5) * 0.34), q, sc); bars.setMatrixAt(i++, M); }
        bars.count = i; }
      const pileCage = cage(4.6, H1M, 1.4, 0xffc23a, 2.0, 0.55, 0.5, 4); pileCage.position.set(PX, 0, 0); scene.add(pileCage);
      // Cent auf Podest
      const ped = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.65, PED, 32), new THREE.MeshStandardMaterial({ color: 0x15161c, metalness: 0.6, roughness: 0.35 })); ped.position.set(CXX, PED / 2, 0); scene.add(ped);
      const cent = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.04, 32), new THREE.MeshStandardMaterial({ color: 0xc8742e, emissive: 0x8a3a10, emissiveIntensity: 0.5, metalness: 0.8, roughness: 0.3 }));
      cent.rotation.x = Math.PI / 2; scene.add(cent);
      // Cent-Turm (linear!) + 1-Mio.-Linie
      const tower = new THREE.Mesh(boxGeo, goldMat()); tower.position.set(CXX, PED, 0); scene.add(tower);
      const towerTop = new THREE.Mesh(boxGeo, new THREE.MeshStandardMaterial({ color: 0xffd23f, emissive: 0xff7a10, emissiveIntensity: 0.6, metalness: 0.6, roughness: 0.3 })); scene.add(towerTop);
      const lineM = cage(9.5, 0.001, 0.001, 0xff4b4b, 2.4, 0.9, 1, 1); lineM.position.set(0, H1M, 0.8); scene.add(lineM);
      const mLab = label("1 MIO. €", { color: "#ff4b4b", border: "#ff4b4b", worldH: 0.3 }); mLab.position.set(-4.4, H1M + 0.28, 0.8); scene.add(mLab);
      const ring27 = new THREE.Mesh(new THREE.TorusGeometry(0.85, 0.04, 12, 64), new THREE.MeshBasicMaterial({ color: 0xffd23f, transparent: true })); ring27.rotation.x = Math.PI / 2; scene.add(ring27);
      // Münzen-Explosion / Regen
      const NC = 70;
      const coinGeo = new THREE.CylinderGeometry(0.13, 0.13, 0.03, 20); coinGeo.rotateX(Math.PI / 2);
      const coins = new THREE.InstancedMesh(coinGeo, new THREE.MeshStandardMaterial({ color: 0xffcc44, emissive: 0xff9a1a, emissiveIntensity: 0.5, metalness: 0.8, roughness: 0.3 }), NC);
      coins.frustumCulled = false; scene.add(coins);
      const coinOff = []; for (let i = 0; i < NC; i++) coinOff.push([rnd() * 6.28, 1.5 + rnd() * 3, 3 + rnd() * 4, rnd() * 6.28, 0.6 + rnd() * 0.9, rnd()]);
      // Menge rennt zur Million
      const NCR = 60;
      const crowdGeo = new THREE.CapsuleGeometry(0.09, 0.16, 4, 8); crowdGeo.translate(0, 0.17, 0);
      const crowd = new THREE.InstancedMesh(crowdGeo, new THREE.MeshStandardMaterial({ color: 0x2a3f9a, emissive: 0x101a50, emissiveIntensity: 0.4 }), NCR); crowd.frustumCulled = false; scene.add(crowd);
      const crowdHead = new THREE.InstancedMesh(new THREE.SphereGeometry(0.075, 10, 8), new THREE.MeshStandardMaterial({ color: 0xd8d8d8 }), NCR); crowdHead.frustumCulled = false; scene.add(crowdHead);
      const crowdD = []; for (let i = 0; i < NCR; i++) crowdD.push([2.5 + rnd() * 5, 0.8 + rnd() * 2.8, rnd() * 0.5, 9 + rnd() * 6]);
      // Held
      function figure(bodyColor) {
        const g = new THREE.Group();
        const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.42, 0.75, 8, 24), new THREE.MeshPhysicalMaterial({ color: bodyColor, metalness: 0.2, roughness: 0.25, clearcoat: 1, clearcoatRoughness: 0.15 }));
        body.position.y = 0.82; g.add(body);
        const head = new THREE.Group(); head.position.y = 1.72; g.add(head);
        head.add(new THREE.Mesh(new THREE.SphereGeometry(0.36, 32, 24), new THREE.MeshPhysicalMaterial({ color: 0xc9cbd2, roughness: 0.32, clearcoat: 1 })));
        g.userData = { body, head }; return g;
      }
      const hero = figure(0x1b2a6b); hero.position.set(0, 0, 1.9); scene.add(hero);
      const x2 = glyph("×2", "#ffd23f", 0.9); scene.add(x2);
      const bigQ = glyph("?", "#ffd23f", 2.2); scene.add(bigQ);

      // ---------- Kamera ----------
      const K = [];
      const k = (t, p, tg) => K.push({ t, p: new THREE.Vector3(...p), g: new THREE.Vector3(...tg) });
      const cut = (t, p, tg) => { const L = K[K.length - 1]; k(t - 0.001, [L.p.x, L.p.y, L.p.z], [L.g.x, L.g.y, L.g.z]); k(t, p, tg); };
      k(0.0, [0, 3.4, 10.5], [0, 2.9, 0]);
      k(B.hook.end, [0, 3.3, 9.6], [0, 2.8, 0]);
      cut(B.wette.start, [1.6, 3.0, 7.4], [1.8, 2.5, 0]);
      k(B.wette.end, [1.7, 3.0, 6.8], [1.9, 2.4, 0]);
      cut(B.mehrheit.start, [-1.2, 4.2, 10.0], [-1.4, 2.6, 0]);
      k(B.mehrheit.end, [-1.6, 4.3, 9.4], [-1.8, 2.6, 0]);
      cut(B.tag10.start, [CXX, 2.2, 4.2], [CXX, 2.0, 0]);
      k(B.tag10.end, [CXX, 2.15, 3.8], [CXX, 1.95, 0]);
      cut(B.tag20.start, [CXX + 0.3, 2.3, 4.4], [CXX, 2.05, 0]);
      k(B.tag20.end, [CXX + 0.4, 2.3, 4.0], [CXX, 2.0, 0]);
      cut(B.twist.start, [0, 3.8, 11.5], [0, 3.2, 0]);
      k(B.twist.end, [0, 3.9, 11.0], [0, 3.3, 0]);
      cut(B.tag27.start, [0.8, 3.6, 10.0], [0.8, 3.3, 0]);
      k(B.tag28.start, [0.6, 4.4, 12.0], [0.6, 4.1, 0]);
      k(B.tag28.end, [0.4, 5.0, 13.5], [0.4, 4.8, 0]);
      k(B.tag30.key, [0.2, 6.5, 17.0], [0.4, 6.2, 0]);
      k(B.tag30.key + 1.0, [0, 10.5, 29.0], [0.6, 9.5, 0]);
      k(B.tag30.end, [0, 10.6, 29.5], [0.6, 9.6, 0]);
      k(B.punch.end, [0, 10.8, 29.0], [0.6, 9.8, 0]);
      cut(B.lehre.start, [0.6, 4.2, 12.0], [0.4, 3.6, 0]);
      k(B.lehre.end, [0.4, 4.6, 13.0], [0.4, 4.0, 0]);
      cut(B.cta.start, [0, 10.0, 27.0], [0.6, 9.2, 0]);
      k(B.T, [0, 10.2, 26.0], [0.6, 9.4, 0]);
      K.sort((a, b) => a.t - b.t);
      const _p = new THREE.Vector3(), _g = new THREE.Vector3();
      function camAt(t) {
        if (t <= K[0].t) { _p.copy(K[0].p); _g.copy(K[0].g); }
        else if (t >= K[K.length - 1].t) { _p.copy(K[K.length - 1].p); _g.copy(K[K.length - 1].g); }
        else for (let i = 0; i < K.length - 1; i++) if (t >= K[i].t && t <= K[i + 1].t) {
          const x = smr(seg(t, K[i].t, K[i + 1].t)); _p.lerpVectors(K[i].p, K[i + 1].p, x); _g.lerpVectors(K[i].g, K[i + 1].g, x); break;
        }
        // leichtes Handkamera-Schweben
        _p.x += Math.sin(t * 0.7) * 0.05; _p.y += Math.sin(t * 0.53 + 1) * 0.04;
        camera.position.copy(_p); camera.lookAt(_g);
      }

      // ---------- Post-Processing ----------
      const composer = new EffectComposer(renderer);
      composer.setPixelRatio(1); composer.setSize(W, H);
      composer.addPass(new RenderPass(scene, camera));
      composer.addPass(new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.55, 0.5, 0.78));
      composer.addPass(new OutputPass());

      // ---------- Bild für Zeitpunkt t (rein funktional) ----------
      const _q = new THREE.Quaternion(), _e = new THREE.Euler(), _s = new THREE.Vector3(), _c = new THREE.Vector3();
      const M2 = new THREE.Matrix4();
      const between = (t, a, b) => t >= a && t < b;
      function render(t) {
        camAt(t);
        const pa = dustGeo.attributes.position.array;
        dustBase.forEach((d, i) => { pa[i * 3] = d[0] + Math.sin(t * 0.3 + d[4]) * 0.3; pa[i * 3 + 1] = (d[1] + t * d[3]) % 9; pa[i * 3 + 2] = d[2]; });
        dustGeo.attributes.position.needsUpdate = true;

        const d = dayAt(t), v = val(d), h = v / 1e6 * H1M;
        cent.position.set(CXX, PED + 0.12 + Math.sin(t * 2) * 0.03 + Math.max(0, h), 0.25); cent.rotation.z = t * 1.5;
        cent.scale.setScalar(t < B.tag27.start ? 1 + 0.25 * Math.sin(t * 6) * (between(t, B.tag10.start, B.twist.start) ? 1 : 0) : 1);
        tower.scale.set(0.9, Math.max(0.0005, h), 0.9); tower.visible = h > 0.0005;
        // Leuchtende Spitze = was in den letzten 3 Tagen dazukam (87,5 %)
        const hot = sm(seg(t, B.punch.key - 0.2, B.punch.key + 0.4)) * (1 - sm(seg(t, B.lehre.start, B.lehre.start + 0.3)));
        const h27 = val(27) / 1e6 * H1M;
        towerTop.visible = hot > 0.01 && h > h27; towerTop.position.set(CXX, PED + h27, 0); towerTop.scale.set(0.95, Math.max(0.001, h - h27), 0.95);
        towerTop.material.emissiveIntensity = 0.4 + 0.5 * hot * (0.7 + 0.3 * Math.sin(t * 8));
        ring27.visible = hot > 0.01; ring27.material.opacity = hot; ring27.position.set(CXX, PED + h27, 0);
        // Million-Linie: blinkt, wenn überholt
        const pass = t >= B.tag28.key ? 1 - seg(t, B.tag28.key, B.tag28.key + 1.2) : 0;
        lineM.material.opacity = 0.9 * (1 - 0.6 * pass * (0.5 + 0.5 * Math.sin(t * 30)));
        // Münzen: Explosion beim Überholen der Million + Regen an Tag 30
        for (let i = 0; i < NC; i++) {
          const o = coinOff[i]; let p = null;
          const f = seg(t, B.tag28.key, B.tag28.key + 2.0), f2 = seg(t, B.tag30.key + 0.3, B.tag30.key + 2.6);
          const ff = f > 0 && f < 1 ? f : (f2 > 0 && f2 < 1 ? f2 : 0), top = PED + (f2 > 0 && f2 < 1 ? val(30) / 1e6 * H1M : 2 * H1M);
          if (ff > 0) { const tt = ff * 2.2; p = _c.set(CXX + Math.cos(o[0]) * o[1] * tt * (f2 > 0 ? 2.2 : 1), top + o[2] * tt * (f2 > 0 ? 1.8 : 1) - 3.5 * tt * tt * (f2 > 0 ? 2.2 : 1), Math.sin(o[0]) * o[1] * tt * 0.5); if (p.y < 0.05) p = null; }
          if (!p) { M2.makeScale(0, 0, 0); coins.setMatrixAt(i, M2); continue; }
          _e.set(t * 5 * o[4] + o[3], t * 3 + o[3], 0); _q.setFromEuler(_e); _s.setScalar(f2 > 0 ? 2.2 : 1); M2.compose(p, _q, _s); coins.setMatrixAt(i, M2);
        }
        coins.instanceMatrix.needsUpdate = true;
        // Menge rennt zur Million
        const cr = between(t, B.mehrheit.start - 0.1, B.tag10.start);
        crowd.visible = crowdHead.visible = cr;
        if (cr) { crowdD.forEach((c, i) => { const f = eout(seg(t, B.mehrheit.start + c[2], B.mehrheit.start + c[2] + 2.0));
          const x = lerp(CXX + c[0] * 0.5, PX + (c[0] - 4.5) * 0.35, f), z = lerp(c[1], 1.0 + (c[1] - 2.2) * 0.3, f), b = Math.abs(Math.sin(t * c[3] + i)) * 0.05;
          M2.compose(_c.set(x, b, z), _q.identity(), _s.setScalar(1)); crowd.setMatrixAt(i, M2);
          M2.compose(_c.set(x, b + 0.4, z), _q.identity(), _s.setScalar(1)); crowdHead.setMatrixAt(i, M2); });
          crowd.instanceMatrix.needsUpdate = true; crowdHead.instanceMatrix.needsUpdate = true; }
        bars.material.emissive.setHex(t >= B.mehrheit.key && t < B.tag10.start ? 0xff3010 : 0xff8a10);
        bars.material.emissiveIntensity = t >= B.mehrheit.key && t < B.tag10.start ? 0.35 + 0.25 * Math.sin(t * 10) : 0.16;
        // Held: schüttelt den Kopf beim Hook, staunt bei Tag 30
        hero.userData.body.scale.set(1, 1 + Math.sin(t * 2.2) * 0.02, 1);
        hero.rotation.y = (t < B.hook.end ? Math.sin(t * 9) * 0.35 * sm(seg(t, B.hook.key - 0.3, B.hook.key)) : 0) + Math.sin(t * 0.8) * 0.05;
        const up = sm(seg(t, B.tag28.key, B.tag28.key + 0.6));
        hero.userData.head.rotation.x = -0.6 * up; hero.position.x = lerp(0, 0.6, up);
        // ×2
        const xa = eout(seg(t, B.wette.key, B.wette.key + 0.4)) * (1 - sm(seg(t, B.mehrheit.start, B.mehrheit.start + 0.2)));
        x2.visible = xa > 0.01; x2.material.opacity = xa; x2.position.set(CXX, PED + 2.0 + Math.sin(t * 4) * 0.06, 0.25); x2.scale.copy(x2.userData.base).multiplyScalar((0.5 + 0.5 * xa) * (1 + 0.12 * Math.max(0, Math.sin(t * 6))));
        // CTA
        const q = eout(seg(t, B.cta.start + 0.1, B.cta.start + 0.8));
        bigQ.visible = q > 0.01; bigQ.material.opacity = q; bigQ.position.set(-1.0, 9.0 + Math.sin(t * 2.5) * 0.2, 0.5); bigQ.scale.copy(bigQ.userData.base).multiplyScalar(0.4 + 0.6 * q);

        composer.render();
      }

      // ---------- Bereitschaft ----------
      renderer.compile(scene, camera);
      ready = true; render(lastT); resolveReady();
    </script>
  </body>
