<template>

  </style>

    <div id="hud-bar" class="clip" data-start="0" data-duration="__D__" data-track-index="0">

    <div id="hud-src2" class="hud-src clip" data-start="__SRC2START__" data-duration="__SRC2DUR__" data-track-index="1"></div>
  </div>
  <script>
    (function () {
      const B = __BEATS__;
      const RATE = 3790000000 / 86400; // 43.866 $ pro Sekunde
      const lab = document.getElementById("hud-label"), num = document.getElementById("hud-num"), del = document.getElementById("hud-delta");
      const clamp = (x) => Math.min(1, Math.max(0, x)), seg = (t, a, b) => clamp((t - a) / (b - a));
      const eout = (x) => 1 - Math.pow(1 - x, 3);
      const usd = (v) => Math.round(v).toLocaleString("de-DE") + " $";
      const GOLD = "rgb(255,210,63)", RED = "rgb(255,72,72)", ORANGE = "rgb(255,166,64)";
      const eur = (v) => v.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
      const RED2 = "rgb(255,72,72)";
      const mix = (a, b, x) => { const p = (c) => c.match(/\d+/g).map(Number); const A = p(a), Bc = p(b); return `rgb(${A.map((v, i) => Math.round(v + (Bc[i] - v) * x)).join(",")})`; };
      const BF_RATE = 6.2e9 / (4 * 86400);
      const eurI = (v) => Math.round(v).toLocaleString("de-DE") + " €";
      const eio2 = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const CW_val = (d) => 0.01 * Math.pow(2, d - 1);
      function CW_day(t) {
        const segs = [[B.tag10.start, 1], [B.tag10.key, 10], [B.tag20.start, 10], [B.tag20.key, 20], [B.tag27.start, 20], [B.tag27.key, 27], [B.tag28.start, 27], [B.tag28.key, 28], [B.tag30.start, 28], [B.tag30.key + 0.9, 30]];
        if (t <= segs[0][0]) return 1;
        for (let i = 0; i < segs.length - 1; i++) if (t < segs[i + 1][0]) return segs[i][1] + (segs[i + 1][1] - segs[i][1]) * eio2(seg(t, segs[i][0], segs[i + 1][0]));
        return 30;
      }
      const CW_eur = (v) => v.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
      function state(t) {
        let label = "1 MILLION ODER 1 CENT?", text = "1.000.000 €", color = GOLD, pulse = 0, delta = "", dA = 0, dColor = ORANGE, live = "";
        const pz = (k) => Math.sin(seg(t, k, k + 0.4) * Math.PI);
        pulse = pz(B.hook.key);
        if (t >= B.wette.start) { label = "ODER 1 CENT – JEDEN TAG"; text = "×2"; pulse = pz(B.wette.key); }
        if (t >= B.mehrheit.start) { label = "FAST JEDER NIMMT"; text = "DIE MILLION"; color = RED; delta = t >= B.mehrheit.key ? "Fehler." : ""; dA = 1; dColor = RED; pulse = pz(B.mehrheit.key); }

          const d = CW_day(t), v = CW_val(d);
          label = "TAG " + Math.floor(d + 1e-6); text = CW_eur(v); color = GOLD; delta = ""; dA = 0;
          if (t >= B.tag10.key && t < B.tag20.start) { delta = "lachhaft"; dA = 1; dColor = RED; }
          if (t >= B.tag20.key && t < B.twist.start) { delta = "die Million sieht gut aus…"; dA = 1; dColor = ORANGE; }
          if (t >= B.twist.start && t < B.tag27.start) { label = "ABER JETZT"; text = "WIRD'S VERRÜCKT"; color = RED; pulse = pz(B.twist.start); }
          if (t >= B.tag28.key) { delta = "MEHR ALS DIE MILLION!"; dA = 1; dColor = ORANGE; color = GOLD; }
          pulse = Math.max(pulse, pz(B.tag27.key), pz(B.tag28.key), pz(B.tag30.key + 0.8) * 1.4);
        }
        if (t >= B.punch.start) { label = "IN DEN LETZTEN 3 TAGEN"; text = t < B.punch.key ? "? %" : (87.5 * eout(seg(t, B.punch.key, B.punch.key + 0.6))).toLocaleString("de-DE", { maximumFractionDigits: 1 }) + " %"; color = GOLD; delta = "vom ganzen Geld"; dA = seg(t, B.punch.key + 0.4, B.punch.key + 0.6); dColor = ORANGE; pulse = pz(B.punch.key + 0.5); }
        if (t >= B.lehre.start) { label = "REICH WIRD, WER"; text = t < B.lehre.key ? "SCHNELL IST?" : "DURCHHÄLT"; color = t < B.lehre.key ? RED : GOLD; delta = ""; pulse = pz(B.lehre.key); }
        if (t >= B.cta.start) { label = "EHRLICH:"; text = "MILLION ODER CENT?"; color = GOLD; delta = "Schreib's in die Kommentare"; dA = 1; dColor = ORANGE; pulse = 0; }
        return { label, text, color, pulse, delta, dA, dColor, live };
      }
      const tl = gsap.timeline({ paused: true });
      tl.to({ x: 0 }, {
        x: 1, duration: __D__, ease: "none",
        onUpdate: () => {
          const t = tl.time(), s = state(t);
          lab.textContent = s.label; num.textContent = s.text; num.style.color = s.color;

          num.style.transform = `scale(${1 + 0.1 * s.pulse})`;
          del.textContent = s.delta || " "; del.style.opacity = s.dA; del.style.color = s.dColor;
          document.getElementById("hud-live").textContent = s.live || "\u00a0";
        },
      }, 0);
      window.__timelines["hud"] = tl;
    })();
