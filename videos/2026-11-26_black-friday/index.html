      function cagePositions(w, h, d, step = 0.5, div = 3) {

      function figure(bodyColor) {
        const g = new THREE.Group();
        const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.42, 0.75, 8, 24), new THREE.MeshPhysicalMaterial({ color: bodyColor, metalness: 0.2, roughness: 0.25, clearcoat: 1, clearcoatRoughness: 0.15 }));
        body.position.y = 0.82; g.add(body);
        const head = new THREE.Group(); head.position.y = 1.72; g.add(head);
        head.add(new THREE.Mesh(new THREE.SphereGeometry(0.36, 32, 24), new THREE.MeshPhysicalMaterial({ color: 0xc9cbd2, roughness: 0.32, clearcoat: 1 })));
        const bags = new THREE.Group(); g.add(bags);
        for (const [sx, col] of [[-0.55, 0xff8a1a], [0.55, 0xffc23a]]) {
          const b = new THREE.Group(); b.position.set(sx, 0.55, 0.12); bags.add(b);
          b.add(new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.46, 0.16), new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.12, metalness: 0.3, roughness: 0.5 })));
          const hnd = new THREE.Mesh(new THREE.TorusGeometry(0.11, 0.018, 8, 24, Math.PI), new THREE.MeshStandardMaterial({ color: 0x111111 })); hnd.position.y = 0.23; b.add(hnd);
        }
        g.userData = { body, head, bags }; return g;
      }
      const FX = -1.5, FZ = 2.0;
      const hero = figure(0x1b2a6b); hero.position.set(FX, 0, FZ); scene.add(hero);
      const bigQ = glyph("?", "#ffd23f", 1.8); scene.add(bigQ);

      // ---------- Kamera ----------
      const K = [];
      const k = (t, p, tg) => K.push({ t, p: new THREE.Vector3(...p), g: new THREE.Vector3(...tg) });
      k(0.0, [-0.4, 3.0, 11.0], [0, 2.7, 0]);
      k(B.hook.key, [-0.4, 2.9, 10.6], [0, 2.8, 0]);
      k(B.hook.key + 1.7, [0.2, 4.2, 13.0], [0, 4.0, 0]);
      k(B.sekunde.key, [2.2, 4.6, 8.8], [1.4, 4.2, 0.6]);
      k(B.sekunde.end, [2.4, 4.6, 8.2], [1.6, 4.1, 0.8]);
      k(B.live.key, [1.2, 2.4, 9.4], [0.2, 5.4, 0]);
      k(B.live.end, [1.0, 2.6, 10.0], [0.2, 5.5, 0]);
      k(B.acht.start, [2.3, 3.4, 7.2], [2.5, 3.3, 1.0]);
      k(B.acht.end, [2.4, 3.4, 6.9], [2.5, 3.3, 1.0]);
      k(B.billiger.key, [-2.0, 3.4, 7.2], [-2.5, 3.1, 0.6]);
      k(B.billiger.end, [-2.1, 3.5, 7.0], [-2.5, 3.1, 0.6]);
      k(B.uvp.key, [2.3, 3.4, 7.2], [2.5, 3.4, 1.0]);
      k(B.uvp.end, [2.4, 3.5, 7.0], [2.5, 3.4, 1.0]);
      k(B.punch.key, [0, 3.0, 7.6], [0, 2.9, 2.4]);
      k(B.punch.end, [0, 3.1, 7.3], [0, 2.9, 2.4]);
      k(B.tipp.key, [2.0, 3.4, 7.4], [2.4, 3.3, 1.0]);
      k(B.tipp.end, [2.0, 3.5, 7.6], [2.3, 3.4, 1.0]);
      k(B.T, [0, 4.6, 13.0], [0, 3.9, -1]);
      K.sort((a, b) => a.t - b.t);
      const _p = new THREE.Vector3(), _g = new THREE.Vector3();
      function camAt(t) {
        if (t <= K[0].t) { _p.copy(K[0].p); _g.copy(K[0].g); }
        else if (t >= K[K.length - 1].t) { _p.copy(K[K.length - 1].p); _g.copy(K[K.length - 1].g); }
        else for (let i = 0; i < K.length - 1; i++) if (t >= K[i].t && t <= K[i + 1].t) {
          const x = smr(seg(t, K[i].t, K[i + 1].t)); _p.lerpVectors(K[i].p, K[i + 1].p, x); _g.lerpVectors(K[i].g, K[i + 1].g, x); break;
        }
        // leichtes Handkamera-Schweben
        _p.x += Math.sin(t * 0.7) * 0.05; _p.y += Math.sin(t * 0.53 + 1) * 0.04;
        camera.position.copy(_p); camera.lookAt(_g);
      }

      // ---------- Post-Processing ----------
      const composer = new EffectComposer(renderer);
      composer.setPixelRatio(1); composer.setSize(W, H);
      composer.addPass(new RenderPass(scene, camera));
      composer.addPass(new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.55, 0.5, 0.78));
      composer.addPass(new OutputPass());

      // ---------- Bild für Zeitpunkt t (rein funktional) ----------
      const _q = new THREE.Quaternion(), _e = new THREE.Euler(), _s = new THREE.Vector3(), _c = new THREE.Vector3();
      const M2 = new THREE.Matrix4();
      const vis = (o, a) => { o.visible = a > 0.01; return a; };
      function render(t) {
        camAt(t);
        const pa = dustGeo.attributes.position.array;
        dustBase.forEach((d, i) => { pa[i * 3] = d[0] + Math.sin(t * 0.3 + d[4]) * 0.3; pa[i * 3 + 1] = (d[1] + t * d[3]) % 9; pa[i * 3 + 2] = d[2]; });
        dustGeo.attributes.position.needsUpdate = true;

        // Turm wächst beim Hook
        const g = eout(seg(t, B.hook.key, B.hook.key + 1.6));
        fill.scale.y = Math.max(0.001, TH * g); fill.visible = g > 0;
        // Münzen: Explosion + Regen bis zum Twist
        for (let i = 0; i < NC; i++) {
          const o = coinOff[i]; let p = null;
          const f = seg(t, B.hook.key + 0.1, B.hook.key + 2.2);
          if (f > 0 && f < 1) { const tt = f * 2.1; p = _c.set(Math.cos(o[0]) * o[1] * tt * 0.9, TH * g + o[2] * tt - 2.7 * tt * tt, Math.sin(o[0]) * o[1] * tt * 0.5 + 0.4); if (p.y < 0.05) p = null; }
          else if (t > B.sekunde.key && t < B.twist.start) { const cyc = 0.9, s0 = B.sekunde.key + o[5] * cyc, ph = ((t - s0) % cyc + cyc) % cyc / cyc; if (t > s0) p = _c.set((o[5] - 0.5) * 1.0, TH + 2.4 * (1 - ph * ph), Math.sin(o[0]) * 0.4); }
          if (!p) { M2.makeScale(0, 0, 0); coins.setMatrixAt(i, M2); continue; }
          _e.set(t * 5 * o[4] + o[3], t * 3 + o[3], 0); _q.setFromEuler(_e); _s.setScalar(1); M2.compose(p, _q, _s); coins.setMatrixAt(i, M2);
        }
        coins.instanceMatrix.needsUpdate = true;
        // Stoppuhr
        const wa = vis(watch, eout(seg(t, B.sekunde.start, B.sekunde.start + 0.4)) * (1 - sm(seg(t, B.twist.start, B.twist.start + 0.3))));
        wMat.opacity = wa; hand.material.opacity = wa; perSec.material.opacity = wa; watch.scale.setScalar(0.5 + 0.5 * wa);
        hand.rotation.z = -(Math.floor(t) + eout(seg(t % 1, 0, 0.12))) * (Math.PI * 2 / 12);
        perSec.scale.copy(perSec.userData.base).multiplyScalar(1 + 0.12 * Math.max(0, 1 - (t % 1) * 4));

        // Preisschild: erscheint beim Twist, zerbricht bei „8 %“
        const ta = eout(seg(t, B.twist.start, B.twist.start + 0.4));
        const crack = seg(t, B.acht.key - 0.15, B.acht.key + 0.9);
        tag.visible = ta > 0.01 && t < B.cta.start + 0.4;
        tag.scale.setScalar((0.4 + 0.6 * ta) * (crack > 0 && crack < 0.25 ? 0.9 : 1));
        face.material.map = t < B.acht.key ? tex50 : (t >= B.uvp.key - 0.2 && t < B.punch.start ? texUVP : tex8); face.material.needsUpdate = true;
        tag.rotation.z = (t < B.acht.key ? Math.sin(t * 2) * 0.04 : 0) + (crack > 0 && crack < 0.3 ? Math.sin(t * 70) * 0.08 : 0);
        tag.position.y = 2.0 + Math.sin(t * 1.8) * 0.05;
        frags.forEach((m) => { const [vx, vy, vz, rs] = m.userData; const f = seg(t, B.acht.key, B.acht.key + 1.2); m.visible = f > 0 && f < 1;
          if (m.visible) { m.position.set(2.5 + vx * f * 1.5, 2.0 + vy * f * 1.6 - 3 * f * f, 1.0 + vz * f); m.rotation.set(rs * f * 3, rs * f * 2, 0); } });
        // UVP
        const ua = vis(uvpLab, sm(seg(t, B.uvp.key - 0.3, B.uvp.key)) * (1 - sm(seg(t, B.punch.start, B.punch.start + 0.3))));
        uvpLab.visible = false;
        const sa = vis(strike, eout(seg(t, B.uvp.key + 0.4, B.uvp.key + 0.7)) * (1 - sm(seg(t, B.punch.start, B.punch.start + 0.3))));
        strike.material.opacity = sa; strike.scale.x = Math.max(0.001, sa); strike.position.set(2.55, 2.0, 1.1); strike.rotation.z = -0.18; strike.scale.y = 1.4;
        // Kalender
        const ca = eout(seg(t, B.billiger.start - 0.2, B.billiger.start + 0.4)) * (1 - sm(seg(t, B.uvp.start, B.uvp.start + 0.4)));
        cal.visible = ca > 0.01; cal.scale.setScalar(0.6 + 0.4 * ca);
        calTiles.forEach((c, i) => {
          const on = c.hot ? eout(seg(t, B.billiger.key + 0.05 * i, B.billiger.key + 0.05 * i + 0.25)) : 0;
          c.bg.material.color.setHex(c.bf ? 0x7a1212 : 0x14161c).lerp(new THREE.Color(0xffc23a), on);
          c.m.material.color.setHex(c.bf ? 0xffaaaa : 0x999999).lerp(new THREE.Color(0x14100a), on);
          c.bg.material.opacity = c.m.material.opacity = ca;
        });
        calLab.material.opacity = ca;
        // 100 Münzen – nur 8 gold
        const wa2 = eout(seg(t, B.punch.start, B.punch.start + 0.5)) * (1 - sm(seg(t, B.tipp.start, B.tipp.start + 0.4)));
        wall.visible = wa2 > 0.01; wall.scale.setScalar(0.6 + 0.4 * wa2); grey.opacity = wa2;
        wallCoins.forEach((m, i) => { const pop = i < 8 ? eout(seg(t, B.punch.key + i * 0.06, B.punch.key + i * 0.06 + 0.2)) : 1; const s = i < 8 ? 0.7 + 0.6 * pop : 1; m.scale.set(s, s, s); m.rotation.y = i < 8 ? t * 2 + i : 0; });
        coinMat.emissiveIntensity = 0.5 + (t > B.punch.key && t < B.tipp.start ? 0.3 * Math.sin(t * 8) : 0);
        // Lupe über dem Preisschild
        const la = vis(lupe, eout(seg(t, B.tipp.start, B.tipp.start + 0.5)) * (1 - sm(seg(t, B.cta.start + 0.3, B.cta.start + 0.8))));
        lMat.opacity = la; glass.material.opacity = 0.12 * la;
        lupe.position.set(2.5 + Math.sin(t * 1.6) * 0.35, 2.1 + Math.cos(t * 1.3) * 0.15, 1.6); lupe.scale.setScalar(0.5 + 0.5 * la);
        // Figur
        hero.userData.body.scale.set(1, 1 + Math.sin(t * 2.2) * 0.02, 1);
        const lookUp = sm(seg(t, B.hook.key + 0.2, B.hook.key + 0.8)) * (1 - sm(seg(t, B.sekunde.start, B.sekunde.start + 0.5)));
        hero.userData.head.rotation.x = -0.5 * lookUp;
        hero.rotation.y = 0.3 + Math.sin(t * 0.8) * 0.06;
        const sad = sm(seg(t, B.punch.key, B.punch.key + 0.5)) * (1 - sm(seg(t, B.tipp.start, B.tipp.start + 0.5)));
        hero.rotation.x = sad * 0.15; hero.userData.bags.position.y = -sad * 0.08;
        // CTA
        const q = eout(seg(t, B.cta.start + 0.2, B.cta.start + 1.0));
        bigQ.visible = q > 0.01; bigQ.material.opacity = q; bigQ.position.set(0, 4.4 + Math.sin(t * 2.5) * 0.1, 1.6); bigQ.scale.copy(bigQ.userData.base).multiplyScalar(0.4 + 0.6 * q);

        composer.render();
      }

      // ---------- Bereitschaft ----------
      renderer.compile(scene, camera);
      ready = true; render(lastT); resolveReady();
    </script>
  </body>
</html>
